name: tests

# Тесты инфраструктуры ревью. Запускаются в репозитории курса — том самом,
# где вносятся все правки. Раньше их приходилось помнить и гонять руками.
#
# Сеть и API модели не используются: прогон занимает секунды.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Установить зависимости тестов
        run: |
          set -euo pipefail
          # jq есть на раннере по умолчанию; PyYAML нужен тестам, которые
          # разбирают workflow-файлы и проверяют права и секреты.
          python3 -m pip install --quiet pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
        shell: bash

      - name: Автотесты
        run: bash .github/review/tests/run-tests.sh
        shell: bash

      # labgen: сквозные тесты гоняют интерпретатор ANTLR на фикстуре Mini.
      # Java есть на раннере; без jar тесты с ANTLR пропускаются, поэтому
      # jar скачивается явно и проверяется по контрольной сумме.
      - name: Тесты labgen
        run: |
          set -euo pipefail
          export ANTLR_JAR="${RUNNER_TEMP}/antlr-4.13.2-complete.jar"
          curl -fsSL -o "${ANTLR_JAR}" https://www.antlr.org/download/antlr-4.13.2-complete.jar
          echo "eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76  ${ANTLR_JAR}" | sha256sum -c -
          python3 -B -m unittest discover -s .github/review/tests/labgen -v
        shell: bash

      # shellcheck ловит то, что не видит `bash -n`: необъявленные
      # переменные, неэкранированные подстановки, ошибки в кавычках.
      # Предупреждения не валят сборку — только ошибки.
      - name: shellcheck
        run: |
          set -uo pipefail
          mapfile -t files < <(find .github/review admin reviewer -name '*.sh' -type f | sort)
          printf 'Проверяю %s скриптов\n' "${#files[@]}"
          shellcheck --severity=error --external-sources "${files[@]}"
        shell: bash
