schema_version: 1
questions:
  - id: q01
    question: Можно ли менять объект через неизменяемое имя?
    concepts: [bindings.mutation, memory.reference_permissions, memory.transfer]
    answer: "Да: JavaScript const запрещает перепривязку, но не запрещает push в массив. Для Pony val утверждение сильнее, чем для box: box запрещает запись через эту ссылку, не обязательно через другие. Нужно сравнивать привязку, объект и права ссылки отдельно."
    evidence: "Карточки JavaScript и Rust описывают привязки; пример Pony сопоставляет box/ref/val."
    gap: "Свойства глубокой и поверхностной изменяемости объекта пока не выделены в отдельную ось; полный поиск по ним невозможен."
    compiler: "Отделить символ и его переприсваиваемость от типа ссылки и допустимых операций над объектом."
  - id: q02
    question: Отсутствие аннотации означает динамическую типизацию?
    concepts: [bindings.introduction, typing.annotations, typing.inference, typing.checking]
    answer: "Нет. Java var и Rust let явно вводят имя, а тип может выводиться статически. Python-аннотация сама по себе не запускает проверку во время исполнения."
    evidence: "Java и Rust показывают статический вывод; Python разделяет language и tooling."
    gap: "Детальные области вывода и роль каждой аннотации пока частично описаны текстом applies_to."
    compiler: "Разделить разбор деклараций, построение таблицы символов, сбор ограничений типов и их проверку."
  - id: q03
    question: Чем перепривязка отличается от сокрытия имени?
    concepts: [bindings.introduction, bindings.assignment, scope.shadowing, scope.resolution]
    answer: "Перепривязка обновляет обозначаемое существующим именем значение; shadowing вводит новое связывание, скрывающее старое. Повторный let в Rust и повторное присваивание Python нельзя одинаково помечать как shadowing."
    evidence: "Карточки Rust и Python содержат разные значения и пояснения."
    gap: "Время жизни захваченных ячеек и алгоритм хранения окружений не моделируются одной записью scope."
    compiler: "Назначать идентификатор каждому связыванию, а не использовать текст имени как единственный ключ на всех уровнях."
  - id: q04
    question: Может ли блок иметь границы, но не создавать область имён?
    concepts: [syntax.blocks, scope.constructs, syntax.statement_terminator]
    answer: "Да. Python if группирует тело отступами, но не создаёт обычной блочной области локальных переменных. Haskell для ряда групп допускает и layout, и явные скобки."
    evidence: "Карточки Python и Haskell показывают независимость синтаксического и семантического решений."
    gap: "Классификация отдельных конструкций требует контекста; одной метки на язык недостаточно."
    compiler: "Не создавать scope автоматически на каждый узел AST, названный block."
  - id: q05
    question: Копия ссылки — это передача по ссылке на переменную?
    concepts: [subprograms.parameter_passing, memory.transfer, bindings.assignment]
    answer: "Нет. Java передаёт значение ссылки: изменение объекта может быть видно, но замена значения параметра не меняет переменную вызывающего. C# ref даёт доступ к самой переменной вызывающего."
    evidence: "Карточки Java, C и C# разграничивают значение ссылки и ссылочный параметр."
    gap: "Для copy-out существенны aliasing и порядок обратного копирования; они пока требуют отдельного пояснения."
    compiler: "Определить, передаётся значение, адрес места хранения или отложенное вычисление; отдельно задать владение."
  - id: q06
    question: Чем checked exception отличается от Result и must-use?
    concepts: [errors.model, errors.checked_exceptions, errors.must_use]
    answer: "Checked exception требует catch/throws для исключительного канала. Result передаёт ошибку обычным значением. Must-use диагностирует некоторые случаи отбрасывания, но не доказывает корректную обработку."
    evidence: "Java checked exceptions противопоставлены Rust Result и явному let _ = operation()."
    gap: "Флаг severity зависит от инструментального профиля; общий тип ошибки не описывает политику всего проекта."
    compiler: "Проверять потоки исключений, возвращаемый тип и предупреждения о неиспользовании как разные задачи."
  - id: q07
    question: Сборщик мусора гарантирует закрытие файла?
    concepts: [memory.management, resources.cleanup, errors.model]
    answer: "Нет. GC отвечает за память; закрытие ресурса имеет собственный протокол. RAII, with и try-with-resources задают явные правила очистки на определённых путях выхода."
    evidence: "Карточки C++, Rust, Python и Java содержат отдельные механизмы памяти и ресурсов."
    gap: "Для утверждения о гарантии нужно назвать аварийные выходы, отмену и прекращение процесса; все эти пути ещё не формализованы в схеме."
    compiler: "При lowering учесть очистку при return и исключительном выходе, а не только при конце текста блока."
  - id: q08
    question: Замыкание и продолжение сохраняют одно и то же?
    concepts: [subprograms.closures, scope.resolution, control.continuation_extent, evaluation.result_protocol]
    answer: "Нет. Замыкание сохраняет доступ к окружению функции; продолжение представляет оставшийся контекст вычисления. Продолжение Scheme можно вызвать повторно, но изменения памяти при этом не откатываются."
    evidence: "Пример Scheme continuation.scm действительно выдаёт 11, 12, 13."
    gap: "One-shot/multi-shot и срок допустимости продолжения пока описываются текстом, а не отдельными значениями онтологии."
    compiler: "Разделить представление environment и continuation; захваченный контекст управления не обязан быть обычным кадром стека."
  - id: q09
    question: Генератор делает язык нестрогим?
    concepts: [evaluation.strategy, evaluation.result_protocol, control.logic_search]
    answer: "Нет. Python yield приостанавливает определённое вычисление, не меняя строгую передачу обычных аргументов. Icon дополнительно возобновляет поиск из-за failure внешнего выражения."
    evidence: "Пример Icon различает find внутри сравнения и уже сохранённое первое значение."
    gap: "Порядок вычисления операндов и стратегия востребованности ещё не разделены на полностью заполненные оси для всех языков."
    compiler: "Определить события resume и failure и состояние, сохраняемое между ними, отдельно от evaluation order вызова."
  - id: q10
    question: Перегрузка, type class и виртуальный вызов — один механизм?
    concepts: [subprograms.overloading, subprograms.generics, abstraction.dispatch, abstraction.contracts]
    answer: "Нет. Java выбирает перегрузку статически, затем может динамически выбрать переопределённый метод. Haskell type class задаёт ограничения операций; CLOS multiple dispatch выбирает методы по нескольким аргументам."
    evidence: "Карточки Java, Haskell и Common Lisp содержат разные описания механизмов."
    gap: "Coherence, приоритет специализаций и порядок комбинации методов пока не представлены отдельными полями."
    compiler: "Не смешивать разрешение имени, выбор сигнатуры, передачу словаря операций и runtime dispatch."
  - id: q11
    question: Сопоставление с образцом — это унификация?
    concepts: [control.pattern_matching, bindings.assignment, computation.instantiation_modes, control.logic_search]
    answer: "Не в общем случае. Pattern matching проверяет форму значения и извлекает части. Унификация согласует два терма с переменными с обеих сторон. В Prolog X=1, X=2 приводит к неудаче, а не к обновлению X до 2."
    evidence: "Карточки Prolog, Rust и Haskell позволяют сравнить направленное сопоставление с унификацией."
    gap: "Occurs-check, rational trees и ограничения образцов требуют уточнения выбранного Prolog-профиля."
    compiler: "Развести проверку конструктора/извлечение полей и алгоритм связывания логических переменных с откатом."
  - id: q12
    question: det означает, что функция обязательно завершится?
    concepts: [computation.instantiation_modes, computation.solution_cardinality, verification.totality]
    answer: "Нет. Mercury det утверждает одно решение для возвращающихся вызовов указанного режима. Проверка termination/productivity — отдельное обязательство."
    evidence: "Документация Mercury явно оговаривает returning calls; пример append имеет det и multi режимы."
    gap: "Карточки Mercury пока нет; эксперимент подготовлен, но ещё не запускался. Заполненная ось словаря не является подтверждённым запуском."
    compiler: "Отдельно анализировать число решений, связанность аргументов, покрытие образцов и завершение."
  - id: q13
    question: Почему одинаковая операция даёт разные результаты для коллекций?
    concepts: [data.collection_multiplicity, evaluation.rank_lifting, control.iteration]
    answer: "Нужно знать кратность, порядок и выбранную ячейку массива. SQL DISTINCT убирает дубликаты; rank в J меняет, к каким частям матрицы применяется операция. Это независимые решения."
    evidence: "SQL запущен на SQLite; для J подготовлены ожидаемые 6 15 и 5 7 9, но запуска ещё нет."
    gap: "Shape, порядок и SQL three-valued truth domain пока не полностью выделены в самостоятельные концепции."
    compiler: "Зафиксировать тип коллекции и правила поднятия операций до выбора реализации циклом или векторной инструкцией."
  - id: q14
    question: Синхронный канал и синхронные такты означают одно и то же?
    concepts: [resources.communication_coupling, resources.receive_selection, computation.time_domain, evaluation.data_availability]
    answer: "Нет. Рандеву согласует отправителя и получателя; логические такты индексируют значения реактивной программы. Selective receive выбирает сообщение, а dataflow suspension ждёт информацию."
    evidence: "Карта сопоставляет occam, Erlang, Lustre и Oz; трасса Lustre рассчитана вручную."
    gap: "Fairness, deadlines и устойчивость к сбоям не следуют из этих меток и требуют отдельных утверждений."
    compiler: "Определить модель ожидания, очередь событий и модельное время независимо от реального планировщика потоков."
  - id: q15
    question: Как отличить присваивание, уравнение и отложенное обновление?
    concepts: [bindings.assignment, computation.equation_causality, computation.update_scheduling, computation.time_domain]
    answer: "Присваивание обновляет цель; уравнение Modelica задаёт отношение для совместного решения; Verilog nonblocking assignment планирует применение уже вычисленной правой части. Похожий знак не задаёт единую семантику."
    evidence: "Verilog swap запущен и различает active/settled; Modelica Ohm пока проверена ручным расчётом."
    gap: "Полные IEEE event regions и разрешимость общих систем уравнений не описаны текущим минимальным примером."
    compiler: "Для этих случаев нужны разные IR: последовательные обновления, система отношений или события отложенных записей."
# Definitions describe concepts, not claims about every language in a family.
# Relation notes state their scope; pedagogical edges are not logical entailment.
# lectures — номера колод docs/lectures/slides/NN-*.md, где понятие разбирается;
# на слайдах это ужатое изложение, полное — в словаре и статьях.
definitions:
  bindings.introduction:
    lectures: ["03", "08"]
    definition: Установление связи между именем и сущностью программы — значением, местом хранения, функцией или логической переменной. Конструкция введения имени не определяет, нужно ли писать его тип.
    example: В Java `var x = 1` явно вводит имя x, хотя тип вычисляет компилятор.
    distinction: Присваивание уже существующей переменной может менять её содержимое, не вводя нового имени.
  bindings.mutation:
    definition: Правила, определяющие, можно ли после введения связывания менять обозначаемое им значение или содержимое соответствующей переменной. Эти правила задаются отдельно от изменяемости достижимого объекта.
    example: JavaScript `const xs = []; xs.push(1)` сохраняет связывание xs, изменяя массив.
    distinction: Неизменяемая привязка не гарантирует глубокой неизменяемости объекта; однократное связывание логической переменной — ещё один механизм.
  bindings.assignment:
    lectures: ["03", "08"]
    definition: Семейство операций обновления мест хранения и установления связей со значениями. Для сравнения различаются присваивание одной цели, распаковка, неизменяемое определение и унификация, а не объявляются одной операцией.
    example: Python `a, b = b, a` обновляет две цели; Prolog `X = 1` пытается унифицировать термы.
    distinction: Haskell `x = 1` задаёт определение, а не команду последующего изменения x. Цепочка присваиваний не равна одновременной распаковке.
  scope.resolution:
    definition: Правило выбора связывания для конкретного вхождения имени. Лексическое разрешение использует структуру программы, динамическое — активные связывания в ходе выполнения.
    example: Обычная переменная Common Lisp в let лексическая; объявленная special может разрешаться динамически.
    distinction: Динамическая область видимости не означает динамическую типизацию; время жизни объекта не равно области видимости имени.
  scope.constructs:
    lectures: ["03", "08"]
    definition: Синтаксические конструкции, создающие области, внутри которых действуют определённые связывания имён и правила их видимости.
    example: Блок JavaScript создаёт область для let, но не отдельную функциональную область для var.
    distinction: Скобки могут группировать операторы без создания области имён; блок if в Python не вводит отдельной области локальных переменных.
  scope.globals:
    definition: Формы доступности и организации связываний вне локального вызова — глобальная среда, пространство модуля или статические члены типа.
    example: Python global обращается к пространству текущего модуля, а Java использует статические поля классов.
    distinction: Верхнеуровневое имя не обязательно доступно из любого модуля и не обязательно обозначает изменяемую переменную.
  scope.shadowing:
    lectures: ["20"]
    definition: Введение нового связывания с тем же именем, из-за которого часть вхождений перестаёт обозначать прежнее связывание.
    example: Rust `let x = 1; let x = "one";` вводит новое связывание во второй декларации.
    distinction: Python `x = 1; x = 2` обычно перепривязывает одно имя, а не создаёт новую скрывающую декларацию.
  typing.checking:
    lectures: ["20"]
    definition: Проверка допустимости операций и сочетаний значений по правилам типов. Статическая выполняется до соответствующего выполнения программы, динамическая — при выполнении; gradual-система описывает взаимодействие статически и динамически типизированных частей.
    example: Java проверяет совместимость аргумента статически; Python может выдать TypeError при выполнении операции.
    distinction: Статическая проверка не гарантирует отсутствия всех ошибок и не требует явных аннотаций у каждого выражения.
  typing.annotations:
    definition: Записанная автором программы информация о типе выражения, связывания, параметра или результата. Роль аннотации зависит от языка и проверяющего инструмента.
    example: "Python `x: int` сообщает тип статическому анализатору, но само по себе не включает runtime-проверку присваиваний."
    distinction: Наличие аннотации не доказывает её проверку, а отсутствие аннотации не доказывает динамическую типизацию.
  typing.inference:
    definition: Выведение статического типа из структуры программы, ограничений и контекста без полной записи типа программистом.
    example: Компилятор выводит тип Java `var x = 1`; анализатор Python может вывести тип локального имени из использования.
    distinction: Определение типа уже вычисленного объекта во время исполнения не является выводом статических типов.
  typing.conversions:
    lectures: ["03", "08", "20"]
    definition: Правила перехода от значения или представления одного типа к другому, явно запрошенного или вставленного неявно. Преобразование может требовать вычисления, проверки и сопровождаться потерей информации.
    example: Java допускает неявное int → float, при котором некоторые целые теряют точность.
    distinction: TypeScript `x as T` обычно является стираемым утверждением о типе, а не преобразованием значения во время исполнения.
  typing.compatibility:
    definition: Условия, при которых значение или выражение допустимо использовать там, где требуется определённый тип или набор операций. Основанием могут быть имена типов, структура или фактически поддержанные операции.
    example: TypeScript сопоставляет структуру интерфейса; Java требует заявленного номинального отношения реализации интерфейса.
    distinction: Совместимость не обязательно означает преобразование представления; наличие одинаковых полей не всегда делает два типа одинаковыми.
  typing.sum_types:
    definition: Описание значения как одной из альтернатив типов или вариантов. Конкретная система определяет, как альтернативы различаются, пересекаются и проверяются при использовании.
    example: Rust `Result<T, E>` имеет варианты Ok и Err; TypeScript union допускает значения объединённых типов.
    distinction: Неразмеченная C union делит представление памяти и не обеспечивает автоматически безопасный выбор активного варианта.
  typing.product_types:
    definition: Составной тип, значение которого содержит компоненты всех заданных типов одновременно; позиции или имена различают компоненты.
    example: Пара `(Int, Bool)` содержит и число, и булево значение; запись связывает компоненты с именами полей.
    distinction: Тип-сумма выбирает альтернативу, тип-произведение объединяет компоненты. Поле класса ещё может иметь ограничения сверх простого произведения.
  typing.nullability:
    definition: "Способ выразить отсутствие полезного значения и ограничить места, где такое отсутствие допустимо: специальное значение, nullable-тип либо явная обёртка с вариантами."
    example: "`Option<T>` отличает Some от None; nullable-ссылка допускает null вместо ссылки на объект."
    distinction: Неинициализированность и расходимость вычисления не равны отсутствию значения; Haskell bottom не является Nothing.
  typing.value_dependency:
    definition: Зависимость структуры типа от значения параметра, позволяющая выражать отношения между данными в типе функции или семейства типов.
    example: Idris `Fin n -> Vect n a -> a` связывает допустимый индекс с длиной вектора.
    distinction: Параметризация только типом элемента не является зависимостью от длины-значения. Зависимые типы сами по себе не требуют завершения каждой программы.
  typing.abstract_type_identity:
    definition: Правила сохранения или создания идентичности типового компонента при абстракции модулей и скрытии его представления.
    example: Два применения SML-функтора с opaque result signature создают различные абстрактные типы, даже если внутри оба представлены int.
    distinction: Скрытие представления не тождественно имени типа или модульному пространству имён; прозрачная сигнатура может сохранять равенство с представлением.
  control.selection:
    lectures: ["03", "08"]
    definition: Выбор ветви вычисления по условию или условиям. Выбор может быть оператором, выражением со значением или набором охранных условий.
    example: Haskell if возвращает значение выбранной ветви; обычный Java if управляет выполнением операторов.
    distinction: Наличие выбора не требует конкретного ключевого слова if; библиотечный протокол тоже может предоставлять условное выполнение.
  control.switch:
    lectures: ["03", "20"]
    definition: Специализированный многовариантный выбор по проверяемому значению и меткам вариантов, с правилами совпадения и переходов конкретного языка.
    example: C switch сравнивает значение с case-метками; Java расширяет switch сопоставлением по типам в новых редакциях.
    distinction: Имя switch не гарантирует только сравнение констант. Полноценное сопоставление с образцом может дополнительно разбирать структуру и связывать имена.
  control.pattern_matching:
    definition: Сопоставление значения с описанием допустимой формы, литерала или конструктора с возможным извлечением частей и связыванием имён.
    example: Rust `Some(x)` проверяет вариант и связывает его содержимое с x.
    distinction: Сопоставление обычно направлено от известного значения к образцу; унификация ищет согласование двух термов, которые оба могут содержать переменные.
  control.until:
    definition: Повторение до истинности условия остановки. Проверка перед телом допускает ноль выполнений, после тела — требует хотя бы одного.
    example: Постусловное repeat-until можно выразить через do-while с отрицанием условия.
    distinction: Предусловное `while not cond` не эквивалентно постусловному циклу, когда cond истинно с самого начала.
  control.do_while:
    definition: Конструкция цикла, сначала выполняющая тело и затем проверяющая условие продолжения для следующей итерации.
    example: C `do { body; } while (cond);` исполняет body хотя бы раз.
    distinction: В until условие обычно задаёт остановку, а не продолжение. Совпадение момента проверки не означает совпадения полярности условия.
  control.iteration:
    lectures: ["20"]
    definition: Способ систематически повторять вычисление — по условию и шагу, элементам последовательности, через генераторную конструкцию или функцию обхода.
    example: Python for получает элементы итератора; C-style for отдельно задаёт инициализацию, условие и шаг.
    distinction: Обход можно выразить рекурсией без наличия синтаксического for; не всякая итерация является счётным циклом.
  control.logic_search:
    definition: Механизмы построения решений логических целей — перебор альтернатив с возвратом, сохранение результатов подцелей или распространение ограничений.
    example: Prolog может вернуться к выбору альтернативной клаузы; tabling сохраняет ответы подцелей.
    distinction: Стратегия поиска и определение множества правильных ответов — разные уровни; распространение ограничений не обязательно перебирает решения.
  control.continuation_extent:
    definition: "Граница контекста вычисления, представленного захваченным продолжением: весь текущий остаток вычисления либо его часть до ограничителя."
    example: Scheme call/cc предоставляет продолжение, к которому можно вернуться; delimited continuation ограничено prompt.
    distinction: Окружение замыкания хранит доступные связывания, продолжение — что делать дальше. Граница захвата не задаёт число разрешённых возобновлений.
  subprograms.overloading:
    lectures: ["03", "08"]
    definition: Использование одного имени для нескольких сигнатур подпрограмм с выбором применимой сигнатуры по правилам языка и контексту вызова.
    example: Java выбирает перегрузку по статическим типам аргументов; TypeScript допускает несколько сигнатур над одной реализацией.
    distinction: Перегрузка не равна выбору переопределённого метода по динамическому типу получателя и не требует нескольких runtime-реализаций.
  subprograms.parameter_passing:
    lectures: ["03", "08"]
    definition: Правила связывания фактических аргументов с формальными параметрами, определяющие доступ к значениям, переменным вызывающей стороны или отложенным вычислениям.
    example: Копия ссылки в Java — передача значения; C# ref может обозначать переменную вызывающего кода.
    distinction: Копирование ссылки не копирует сам объект. Передача параметра не определяет сама по себе перенос владения ресурсом.
  subprograms.placement:
    lectures: ["03"]
    definition: "Допустимые структурные места определения подпрограммы в программе: верхний уровень, выделенная область объявлений, член типа или локальная область."
    example: Стандарт C допускает определения функций на уровне файла, но не вложенные определения функций.
    distinction: Разрешение вложенного определения не означает автоматического захвата окружения; Rust local fn и замыкание различаются.
  subprograms.nesting:
    definition: Возможность определять именованную подпрограмму внутри области другой подпрограммы или локальной связывающей конструкции.
    example: Python def внутри def создаёт локальную именованную функцию.
    distinction: Анонимная лямбда и вложенная именованная функция — разные синтаксические возможности; захват внешних переменных проверяется отдельно.
  subprograms.closures:
    definition: Сохранение функции вместе с доступом к необходимым связываниям окружающей лексической среды. Способ захвата значений, переменных и владения определяется языком.
    example: Возвращённая Python-функция может читать переменную внешнего вызова после его завершения.
    distinction: Захват окружения не равен захвату стека управления; функция без свободных переменных не демонстрирует необходимость окружения.
  subprograms.lambda:
    lectures: ["03"]
    definition: Конструкция создания функции как выражения без обязательного отдельного именованного определения.
    example: "Python `lambda x: x + 1` создаёт функцию, которую можно передать как аргумент."
    distinction: Анонимность — свойство записи, захват окружения — семантический механизм. Именованная функция тоже может быть замыканием.
  subprograms.generics:
    definition: Параметризация типов или подпрограмм типовыми параметрами, позволяющая описать семейство применений без отдельной ручной реализации для каждого конкретного типа.
    example: Одна функция над списком T применима к спискам разных типов элементов при соблюдении ограничений на T.
    distinction: CLOS generic function относится прежде всего к диспетчеризации методов. Параметризация не гарантирует полную независимость поведения от конкретного типа.
  subprograms.generic_mechanism:
    definition: Механизмы реализации обобщённого кода и его ограничений — специализированные экземпляры, стирание параметров, их сохранение во время исполнения или передача наборов операций.
    example: Мономорфизация создаёт специализации; словарь может передавать реализации операций type class.
    distinction: Эти механизмы могут сочетаться; передача словаря реализует ограниченный полиморфизм и не является обязательным устройством любых generics.
  subprograms.default_args:
    definition: Правила получения аргумента, который вызывающий код не передал явно, из заданного определения или выражения по умолчанию.
    example: Python вычисляет default-значение при определении функции, что заметно для изменяемого списка.
    distinction: Аргумент по умолчанию не обязательно вычисляется заново при каждом вызове; перегрузка с меньшим числом параметров — иной механизм.
  subprograms.named_args:
    definition: Сопоставление фактического аргумента с параметром по имени, а не только по позиции в списке вызова.
    example: Python `sorted(xs, reverse=True)` выбирает параметр reverse по имени.
    distinction: Передача объекта с именованными полями не означает поддержку именованных аргументов самим протоколом вызова.
  abstraction.contracts:
    definition: "Требования к доступным операциям типа или значения, через которые код использует разные реализации единообразно: интерфейсы, traits, type classes или протоколы."
    example: "Ограничение Rust `T: Display` требует доступности определённого поведения форматирования."
    distinction: Наличие метода deposit в интерфейсе не выражает постусловие об увеличении баланса; поведенческие контракты описываются отдельно.
  abstraction.dispatch:
    definition: Выбор реализации вызываемой операции по статической информации или динамическим характеристикам одного либо нескольких аргументов.
    example: Виртуальный метод выбирается по получателю; CLOS может выбирать применимые методы по нескольким обязательным аргументам.
    distinction: Статический выбор перегрузки и последующая динамическая диспетчеризация могут участвовать в одном вызове последовательно.
  abstraction.inheritance:
    definition: Получение реализации или состояния типа из одного либо нескольких родительских типов с правилами дополнения и переопределения.
    example: Класс может наследовать реализацию метода и заменить её своей.
    distinction: Подтипизация, реализация интерфейса и композиция не обязательно требуют наследования реализации.
  abstraction.modules:
    definition: Организация программы в единицы с контролируемыми именами, зависимостями и границами использования; конкретный механизм определяет импорт, экспорт и параметризацию.
    example: SML functor принимает модуль по сигнатуре и строит модуль-результат.
    distinction: Текстовый include, namespace и модуль со скрытыми типами дают разные гарантии, хотя все участвуют в организации кода.
  evaluation.strategy:
    definition: "Правила востребованности вычислений: требует ли операция значения аргумента до своего выполнения или может получить результат без вычисления некоторых аргументов."
    example: Нестрогая функция может вернуть константу, не вычисляя расходящийся аргумент.
    distinction: Нестрогость не задаёт порядок вычисления всех операндов и не обещает мемоизацию каждого вызова функции.
  evaluation.effects:
    definition: Способы выражения и контроля наблюдаемых действий помимо получения обычного значения — изменения состояния, ввода-вывода и других эффектов.
    example: Haskell IO отмечает действия в типе; обработчики эффектов задают интерпретацию операций эффекта.
    distinction: Типизированный эффект и его обработчик — разные механизмы. Чистая функция может расходиться, поэтому чистота не равна тотальности.
  evaluation.tail_calls:
    definition: Гарантия, что хвостовой вызов не требует сохранения дополнительного контекста возврата и не вызывает неограниченного роста такого контекста в цепочке хвостовых вызовов.
    example: Хвостовая рекурсия может выражать цикл без накопления кадров возврата.
    distinction: Оптимизация, иногда выполняемая компилятором, слабее гарантии языка; память под данные при этом всё ещё может расти.
  evaluation.rank_lifting:
    definition: Автоматическое применение операции к ячейкам массива выбранной размерности с правилами объединения результатов и согласования аргументов.
    example: В J одна редукция с рангом 1 суммирует строки, с рангом 2 действует на всю матрицу.
    distinction: Наличие массивов или явного map не означает встроенной семантики ранга; rank — число осей, shape — их размеры.
  evaluation.result_protocol:
    definition: "Правила выдачи результатов и инициирования следующего результата: обычный возврат, явное возобновление или автоматический поиск альтернатив при неудаче."
    example: Icon возобновляет find после неудачи внешнего сравнения, тогда как потребитель Python-генератора явно запрашивает следующий элемент.
    distinction: Несколько значений одного возврата не равны нескольким альтернативным решениям; генератор не обязан выполняться параллельно.
  evaluation.data_availability:
    definition: Приостановка или запуск вычисления в зависимости от наличия необходимой информации на входах или в логических переменных.
    example: Oz приостанавливает вычисление `X + 1`, если X ещё не связан с числом.
    distinction: Ожидание информации не является чтением нуля и не следует автоматически из наличия унификации или нестрогости.
  memory.management:
    definition: "Политика определения момента и ответственного за освобождение памяти объектов: явный вызов, анализ достижимости, подсчёт ссылок или правила владения и времени жизни."
    example: Подсчёт ссылок может немедленно освободить объект без ссылок, но цикл требует отдельного решения.
    distinction: Освобождение памяти не гарантирует своевременного закрытия файла; GC не означает отсутствие всех утечек ресурсов.
  memory.transfer:
    definition: Правила копирования значений, перемещения владения и разделения доступа к объектам, включая заимствования с ограниченным временем использования.
    example: После перемещения String в Rust прежнее связывание нельзя использовать как владельца этого значения.
    distinction: Перемещение не обязательно физически переносит байты и не тождественно передаче параметра по ссылке.
  memory.reference_permissions:
    definition: Права конкретной ссылки на чтение и изменение объекта и ограничения на одновременное существование других ссылок к нему.
    example: Pony box даёт представление для чтения, хотя другая ref-ссылка в том же акторе может менять объект.
    distinction: Read-only view не означает неизменяемость всего объекта; изоляция алиасов не равна требованию использовать значение ровно один раз.
  errors.model:
    lectures: ["03", "20"]
    definition: "Каналы представления и передачи неуспешного исхода или исключительной ситуации: значение, исключение, condition/restart, логическая неудача или аварийный механизм."
    example: Rust Result возвращает данные; Prolog failure предлагает искать другие решения; condition Common Lisp может быть обработано с продолжением.
    distinction: Не всякий failure является ошибкой, не всякое condition требует раскрутки стека, а сигнал ОС не является общей моделью ошибок языка.
  errors.checked_exceptions:
    definition: Статическое требование обработать определённые классы исключений или объявить возможность их распространения в контракте подпрограммы.
    example: Java требует catch или throws для проверяемых исключений, с установленными языком исключениями из этого правила.
    distinction: Наличие типа ошибки в Result не превращает его в checked exception; непроверяемые исключения могут сосуществовать с проверяемыми.
  errors.must_use:
    definition: Диагностика отбрасывания результата, который помечен как требующий внимания вызывающего кода. Уровень диагностики и допустимые способы отбрасывания зависят от профиля.
    example: Rust предупреждает о некоторых неиспользованных Result, но допускает явное `let _ = ...`.
    distinction: Использовать значение не обязательно означает корректно обработать ошибку; предупреждение не равно запрету компиляции.
  resources.cleanup:
    lectures: ["20"]
    definition: Правила выполнения освобождающих действий при завершении работы с ресурсом или выходе из области, включая обычные и исключительные пути.
    example: Деструктор RAII, Python with и Java try-with-resources ограничивают время использования ресурсов разными механизмами.
    distinction: Ни одна такая запись без уточнений не обещает очистку при аварийном завершении процесса; очистка не тождественна сборке мусора.
  resources.io:
    definition: Уровень и форма предоставления операций обмена с внешним окружением — встроенная операция, стандартная библиотека, макрос или API конкретной среды.
    example: Python print встроен, а Java System.out — библиотечный API.
    distinction: Доступность console.log в хосте не делает файловый или консольный ввод-вывод универсальной гарантией ECMAScript.
  resources.concurrency:
    definition: Возможность организовать несколько вычислений с перекрывающимся временем жизни и правила их продвижения и взаимодействия.
    example: Акторы обмениваются сообщениями; async-функции могут приостанавливаться без выделения отдельного потока каждой функции.
    distinction: Конкурентность не гарантирует одновременное выполнение на нескольких ядрах; наличие await не определяет политику планировщика.
  resources.communication_coupling:
    definition: "Степень зависимости завершения отправки от готовности получателя: независимое помещение сообщения в очередь или согласованная встреча отправителя и получателя."
    example: Erlang отправляет в mailbox; occam использует синхронное рандеву по каналу.
    distinction: Синхронная коммуникация не означает синхронную реактивную модель времени или гарантию доставки при отказах.
  resources.receive_selection:
    definition: Правило выбора доступного сообщения из очереди получателя — например, только голова либо первое сообщение, подходящее под образец.
    example: Erlang receive может оставить раннее неподходящее сообщение и обработать более позднее подходящее.
    distinction: Mailbox сам по себе не задаёт selective receive; к небуферизованному каналу без очереди это сравнение напрямую неприменимо.
  syntax.blocks:
    lectures: ["03"]
    definition: Способ обозначения границ синтаксических групп — разделителями, значимыми отступами или структурой читаемых форм.
    example: Haskell допускает как layout, так и явные фигурные скобки для соответствующих групп.
    distinction: Синтаксическая группа не обязана создавать область видимости, а поддержанные способы не всегда взаимоисключающие.
  syntax.statement_terminator:
    definition: "Правила распознавания границ операторов и определений: терминатор, разделитель, перевод строки либо структура формы."
    example: Prolog завершает клаузу точкой; в Lisp граница формы задаётся её структурой.
    distinction: Терминатор и разделитель — разные роли; автоматическая вставка точки с запятой не означает, что любой перенос строки завершает оператор.
  syntax.case_sensitive:
    definition: Правило различения идентификаторов по регистру после предусмотренных языком шагов чтения и нормализации.
    example: Python различает name и Name; Common Lisp reader по умолчанию преобразует регистр неэкранированных символов.
    distinction: Политику чтения символов нельзя без уточнений приравнивать к сравнению строк или объявлять одинаковой для всех Lisp-диалектов.
  syntax.metaprogramming:
    definition: Средства, с помощью которых программа анализирует, создаёт или преобразует код либо его представление на определённой стадии обработки.
    example: Препроцессор C преобразует токены; Lisp defmacro преобразует формы; рефлексия исследует доступные сведения о программе.
    distinction: Вычисление при компиляции не обязательно меняет синтаксис, а возможность eval не означает лексический захват окружения вызывающего кода.
  syntax.macro_hygiene:
    definition: Сохранение корректных связей имён при раскрытии макроса, предотвращающее непреднамеренный захват между введёнными именами и контекстом использования.
    example: syntax-rules Scheme позволяет макросу ввести tmp без захвата одноимённой переменной пользователя.
    distinction: Уникальные имена, выбранные вручную, являются техникой предотвращения захвата, а не автоматической гарантией любого макромеханизма.
  syntax.program_representation:
    definition: "Форма, в которой автор задаёт исходную программу для исполнения или трансляции: текст либо структурный граф с узлами и связями."
    example: Граф G в LabVIEW является программой; граф AST в отладчике текстового языка — её производным представлением.
    distinction: Графическая запись сама по себе не доказывает dataflow-семантику или параллельное выполнение.
  paradigm.supported:
    lectures: ["02"]
    definition: Устойчивые способы организации вычислений и программных абстракций, поддержанные механизмами языка и его практикой использования.
    example: Один язык может поддерживать императивный, функциональный и объектный стили.
    distinction: Название парадигмы не заменяет перечень конкретных гарантий; функциональные возможности Python не делают его нестрогим Haskell.
  data.collection_multiplicity:
    definition: "Правила учёта повторных элементов и их позиций в конкретной коллекции или результате операции: присутствие, число вхождений либо позиционные вхождения."
    example: SQL SELECT ALL сохраняет дубликаты, SELECT DISTINCT устраняет их.
    distinction: Кратность и порядок независимы; наблюдаемый порядок строк без ORDER BY не является гарантией последовательности.
  data.numeric_radix:
    definition: Основание представления и арифметики числового типа или поля, например двоичное либо десятичное.
    example: Десятичное поле COBOL и двоичный float представляют дробные значения по разным правилам.
    distinction: Литерал 0x10 меняет запись числа, но сам по себе не определяет арифметическую модель типа.
  data.numeric_precision:
    definition: Ограничение количества значащих разрядов, задаваемое типом, полем или настраиваемым контекстом вычисления.
    example: Python int не имеет заранее фиксированной разрядности, а PIC-поле COBOL имеет заданное число позиций.
    distinction: Точность не равна масштабу или положению точки; произвольная точность ограничена ресурсами и не означает точное представление любого вещественного числа.
  computation.rule_semantics:
    definition: "Смысл применения правил к состоянию задачи: поиск ответа на цель, построение замыкания фактов либо преобразование хранилища с фиксацией выбора."
    example: Положительный конечный Datalog задаёт наименьшую неподвижную точку отношений; CHR переписывает хранилище ограничений.
    distinction: Семантика результата не предписывает единственный алгоритм реализации; top-down и bottom-up — стратегии, не универсальные названия языковых семантик.
  computation.instantiation_modes:
    definition: Описание требуемой связанности аргументов до вызова и гарантируемой связанности после него, отдельно от типов значений.
    example: Mercury in обычно задаёт ground → ground, out — free → ground.
    distinction: Режим out логического аргумента не равен C# out и не определяет механизм передачи по ссылке или число решений.
  computation.solution_cardinality:
    definition: Контракт количества успешных решений и допустимости неудачи для определённого режима вызова при его возврате.
    example: Mercury det означает одно решение, semidet — ноль или одно, multi — одно или больше, nondet — ноль или больше.
    distinction: det не доказывает завершение и не описывает порядок планирования потоков; несколько решений не равны нескольким возвращаемым компонентам одного результата.
  computation.time_domain:
    definition: "Встроенный смысл времени, относительно которого определены значения и изменения модели: логические такты, дискретные события, непрерывное время или их сочетание."
    example: Поток Lustre задаёт значение на логических тактах; Modelica может описывать непрерывную динамику с дискретными событиями.
    distinction: Логический такт не задаёт длительность выполнения на процессоре и сам по себе не гарантирует real-time deadline.
  computation.equation_causality:
    definition: Различие между направленным обновлением цели, определением выходного потока и ненаправленным отношением величин, решаемым совместно с другими уравнениями.
    example: Modelica `v = R*i` позволяет решать относительно i или v в зависимости от остальных уравнений.
    distinction: Знак равенства не всегда означает присваивание; система уравнений может не иметь решения или иметь несколько решений.
  computation.update_scheduling:
    definition: Момент применения изменения состояния относительно вычисления правой части и других событий в модели аппаратной симуляции.
    example: Verilog nonblocking assignment вычисляет RHS сейчас, а применение значения помещает в очередь обновлений.
    distinction: Неблокирующее присваивание не равно многопоточному атомарному обмену; наблюдение результата зависит от фазы симуляционного шага.
  verification.totality:
    definition: Политика проверки того, что определение покрывает допустимые входы и завершается либо продуктивно выдаёт результат в принятой модели вычислений.
    example: Idris total требует больше, чем покрытие всех образцов; partial явно ослабляет обязательства.
    distinction: Типизация и чистота не доказывают тотальность, а успешная проверка через непроверенное допущение не является доказательством.
  verification.behavioral_contracts:
    definition: Предикаты допустимого входа, результата, изменения состояния и инвариантов, которыми описывается наблюдаемое поведение программного компонента.
    example: Eiffel ensure может потребовать `balance = old balance + amount` после deposit.
    distinction: Контракт можно проверять при выполнении или доказывать инструментом; его наличие в тексте ещё не означает доказанность.

