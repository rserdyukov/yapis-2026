id: common-lisp
publish: true
default_profile: ansi

meta:
  name: Common Lisp
  ru: Common Lisp
  wikidata: Q849146
  appeared:
    value: 1984
    sources:
      - {url: "https://www.wikidata.org/wiki/Q849146", title: "Wikidata P571", retrieved: 2026-09-24}
  designers: [Scott E. Fahlman, Richard P. Gabriel, David A. Moon]
  organizations: [ANSI X3J13]
  website: https://common-lisp.net/
  spec: https://www.lispworks.com/documentation/HyperSpec/Front/index.htm
  summary: >
    ANSI Common Lisp сочетает динамические типы, лексические замыкания,
    special-переменные с динамической областью, CLOS и расширяемый синтаксис.
    Основа — ANSI X3.226-1994 в изложении Common Lisp HyperSpec;
    расширения отдельных реализаций не предполагаются.

versions: []
profiles:
  ansi: "ANSI Common Lisp (X3.226-1994); базовый профиль всех записей. HyperSpec — гипертекстовое представление спецификации."

concepts:
  bindings.introduction:
    - value: explicit
      note: "let/let*, параметры функций и defvar/defparameter вводят связывания; setq меняет значение существующего связывания."
    - value: pattern
      applies_to: destructuring-bind
      note: "Макрос связывает переменные по структуре списка, используя destructuring lambda list."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/m_destru.htm", title: "CLHS: DESTRUCTURING-BIND"}
  bindings.mutation:
    - value: rebindable
      note: "setq изменяет значение переменной; setf обобщает изменение на места хранения. Изменяемость объекта не равна изменяемости связывания."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/s_setq.htm", title: "CLHS: SETQ"}
  bindings.assignment:
    - value: single
      note: "setq и setf могут перечислять несколько мест, но обновляют их по определённым правилам последовательности."
    - value: multiple
      applies_to: multiple-value-setq
      note: "Распределяет несколько возвращённых значений по переменным; multiple values — отдельный механизм, а не объект-кортеж."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/m_mult_2.htm", title: "CLHS: MULTIPLE-VALUE-SETQ"}
  scope.resolution:
    - value: lexical
      note: "Обычные локальные переменные и локальные функции имеют лексическую область; пространства имён переменных и функций различны."
    - value: dynamic
      applies_to: special-переменные
      note: "Объявление special и defvar/defparameter задают динамические связывания; соглашение об имёнах со звёздочками само по себе не включает этот режим."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/d_specia.htm", title: "CLHS: SPECIAL declaration"}
  scope.constructs:
    - value: binding_form
      note: "let/let*, flet/labels и другие связывающие формы; progn сам по себе не вводит область переменных."
    - value: subprogram
      applies_to: параметры функций
  scope.globals:
    - value: globals
      note: "defvar и defparameter провозглашают переменную special и задают глобальное значение; defvar не заменяет уже связанное значение."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/m_defpar.htm", title: "CLHS: DEFVAR, DEFPARAMETER"}
  scope.shadowing:
    - value: allowed
      note: "Внутреннее лексическое связывание скрывает внешнее; динамическое связывание special действует в пределах своего динамического времени жизни."
  typing.checking:
    - value: dynamic
      note: "Тип принадлежит объекту. Декларации типов могут использоваться компилятором; неверная декларация не обязана приводить к безопасной runtime-проверке во всех режимах optimize/safety."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/04_a.htm", title: "CLHS: Introduction to Types and Classes"}
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/d_type.htm", title: "CLHS: TYPE declaration"}
  typing.annotations:
    - value: optional
      note: "declare/declaim и the выражают сведения и утверждения о типах; объявления не превращают ANSI Common Lisp в обязательно статически проверяемый язык."
  typing.conversions:
    - value: explicit
      note: "coerce и функции вроде float выполняют конкретные допустимые преобразования."
    - value: implicit
      applies_to: числовые операции
      note: "Правила numeric contagion согласуют представления аргументов; это не универсальное преобразование строк в числа."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/12_a.htm", title: "CLHS: Numeric Operations"}
  typing.product_types:
    - value: record
      note: "defstruct задаёт структуры со слотами, а CLOS — классы с объектами и слотами."
  typing.nullability:
    - value: sentinel
      note: "nil одновременно ложь и пустой список; это обычный Lisp-объект, допустимость которого зависит от операции. Тип null содержит только nil."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/t_null.htm", title: "CLHS: Type NULL"}
  control.selection:
    - value: expression
      note: "if и cond возвращают значения; только nil ложно."
  control.switch:
    - value: true
      note: "case выбирает ветвь по eql с ключами; typecase — отдельный выбор по типу."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/m_case_.htm", title: "CLHS: CASE, CCASE, ECASE"}
  control.until:
    - value: pre_test
      applies_to: loop с until перед основным действием
      note: "until — условие завершения макроса loop; положение в теле определяет, до каких действий оно проверяется."
    - value: post_test
      applies_to: loop с until после основного действия
      note: "Проверка после действия даёт форму с постусловием; это не отдельный ключевой оператор ядра."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/06_a.htm", title: "CLHS: The LOOP Facility"}
  control.iteration:
    - value: foreach
      note: "dolist и loop; dotimes задаёт счётное повторение."
    - value: higher_order
      note: "mapcar/map и reduce — стандартные функции обработки последовательностей."
  subprograms.overloading:
    - value: false
      note: "CLOS generic functions используют динамическую множественную диспетчеризацию и комбинацию методов, а не Java-подобный выбор перегрузки по статической сигнатуре."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/07_f.htm", title: "CLHS: Generic Functions and Methods"}
  subprograms.parameter_passing:
    - value: by_sharing
      note: "Параметры связываются с переданными объектами. Изменение объекта может быть видно вызывающему; setq параметра меняет только соответствующее связывание."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/03_ababc.htm", title: "CLHS: Function Forms"}
  subprograms.placement:
    - value: local
      note: "flet задаёт локальные функции, labels допускает их взаимную рекурсию. defun создаёт глобальное определение и может вычисляться не только на верхнем уровне; это не автоматическое лексическое вложение."
  subprograms.nesting:
    - value: true
      note: "Именованные локальные функции flet/labels."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/s_flet_.htm", title: "CLHS: FLET, LABELS, MACROLET"}
  subprograms.closures:
    - value: true
      note: "Замыкание захватывает лексические связывания, а не снимок значений; special-переменные разрешаются динамически."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/03_ad.htm", title: "CLHS: Closures and Lexical Binding"}
  subprograms.lambda:
    - value: true
  subprograms.default_args:
    - value: true
      note: "&optional и &key; init-form вычисляется при отсутствии соответствующего аргумента."
  subprograms.named_args:
    - value: true
      note: "&key задаёт keyword arguments; keyword-символы участвуют в протоколе обычного вызова."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/03_da.htm", title: "CLHS: Ordinary Lambda Lists"}
  abstraction.dispatch:
    - value: multiple
      note: "CLOS выбирает применимые методы по специализаторам обязательных аргументов, включая классы и eql-специализаторы; method combination определяет их совместное выполнение."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/07_f.htm", title: "CLHS: Generic Functions and Methods"}
  abstraction.inheritance:
    - value: multiple
      note: "CLOS-класс может иметь несколько прямых суперклассов; порядок предшествования классов влияет на наследование и методы."
  abstraction.modules:
    - value: namespaces
      note: "Пакеты управляют идентичностью, доступностью и экспортом символов; это не система загрузки файлов или проектов вроде ASDF."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/11_a.htm", title: "CLHS: Package Concepts"}
  evaluation.strategy:
    - value: strict
      applies_to: обычные вызовы функций
      note: "Аргументы вычисляются слева направо; специальные операторы и макросы имеют собственные правила вычисления подформ."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/03_ababc.htm", title: "CLHS: Function Forms"}
  errors.model:
    - value: conditions_restarts
      note: "Сигнализация condition отделена от выбора restart. Обработчик может работать до раскрутки стека; не всякое condition является ошибкой и не всякая обработка требует нелокального выхода."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/09_a.htm", title: "CLHS: Condition System Concepts"}
  resources.cleanup:
    - value: finally
      note: "unwind-protect выполняет cleanup-формы при нормальном и нелокальном выходе из защищённой формы. Соответствие finally здесь семантическое; имя конструкции — unwind-protect."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/s_unwind.htm", title: "CLHS: UNWIND-PROTECT"}
    - value: resource_statement
      applies_to: with-open-file
      note: "Стандартный макрос ограничивает динамическое время жизни потока и закрывает его при выходе."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/m_w_open.htm", title: "CLHS: WITH-OPEN-FILE"}
  resources.io:
    - value: stdlib
      layer: standard_library
      note: "Стандартные потоки, read/write и format. Reader читает Lisp-объекты, что отличается от простого чтения строки."
  syntax.blocks:
    - value: s_expressions
      note: "Формы представлены объектами, обычно записанными как списки в скобках; reader macros расширяют способ чтения."
  syntax.statement_terminator:
    - value: structural
      note: "Границы формы определяются прочитанным объектом, в частности сбалансированным списком; точка с запятой начинает комментарий, а не завершает оператор."
  syntax.metaprogramming:
    - value: syntactic_macros
      note: "defmacro преобразует формы до вычисления; гигиена не обеспечивается автоматически."
    - value: runtime_code
      note: "eval и compile работают с представленными Lisp-объектами формами; eval не захватывает произвольное лексическое окружение вызывающего."
      sources:
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/m_defmac.htm", title: "CLHS: DEFMACRO"}
        - {url: "https://www.lispworks.com/documentation/HyperSpec/Body/f_eval.htm", title: "CLHS: EVAL"}
  paradigm.supported:
    - value: imperative
    - value: functional
    - value: object_oriented
