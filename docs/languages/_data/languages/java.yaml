profiles:
  java21: "Java SE 21, JLS 21 и стандартная библиотека, без preview-возможностей; базовый срез карточки. Исторические границы и локальные контексты отмечены отдельно."
  local_variables: Локальные переменные с инициализатором.
  signatures: Параметры и результаты методов, поля классов.

concepts:
  bindings.introduction:
    - value: explicit
      note: "`int x = 1;` и `var x = 1;` — явные объявления; var опускает только аннотацию типа"
  typing.annotations:
    - value: required
      profile: signatures
    - value: optional
      since: "10"
      profile: local_variables
      applies_to: локальные переменные с инициализатором
      note: "`var x = 1;` — тип выводится, но объявление остаётся явным (JEP 286); поля и параметры именованных методов требуют типа"
  bindings.mutation:
    - value: rebindable
    - value: immutable
      applies_to: final-переменные
      note: "final запрещает перепривязку, но не изменение объекта по ссылке."
  typing.conversions:
    - value: explicit
      note: "оператор приведения `(int) x`; сужение может терять информацию"
    - value: implicit
      applies_to: расширяющие преобразования и boxing
      note: "Расширение int → float и long → float/double может терять точность (JLS 5.1.2). Есть boxing/unboxing и расширение ссылок; некоторые сужения констант допустимы без cast."
  bindings.assignment:
    - value: single
      note: "`a = b = 0` — цепочка одиночных присваиваний; множественного `a, b = c, d` нет"
  scope.resolution:
    - value: lexical
  scope.constructs:
    - value: subprogram
    - value: block
    - value: class
  syntax.blocks:
    - value: explicit
      note: "фигурные скобки; для одного оператора их можно опустить, но это не блок"
  control.selection:
    - value: statement
    - value: expression
      note: "тернарное условное выражение `cond ? a : b`"
  control.switch:
    - value: true
      note: "`switch` по константам с 1.0; выражение `switch` со стрелками — с 14 (JEP 361); сопоставление по типам — с 21 (JEP 441)"
  control.pattern_matching:
    - value: true
      since: "21"
      applies_to: record patterns
      note: "Деконструкция record-значений, включая вложенные образцы; граница относится к финализации record patterns, а не ко всем формам pattern matching."
      sources:
        - {url: "https://openjdk.org/jeps/440", title: "JEP 440: Record Patterns", retrieved: 2026-09-20}
  subprograms.overloading:
    - value: true
      note: "выбор по статическим типам аргументов на этапе компиляции"
  subprograms.parameter_passing:
    - value: by_value
      applies_to: примитивные и ссылочные типы
      note: "JLS 8.4.1 формально называет это передачей по значению — копируется ссылка; изменение объекта видно вызывающему, перепривязка параметра — нет"
      sources:
        - {url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html#jls-8.4.1", title: "JLS 8.4.1 Formal Parameters", retrieved: 2026-09-18}
  memory.transfer:
    - value: copy
      note: "копируется значение примитива или ссылки"
    - value: shared_reference
      applies_to: объекты ссылочных типов
  subprograms.placement:
    - value: type_member
      note: "вложенных методов нет; обход — лямбды (с 8) и локальные классы внутри метода"
  subprograms.nesting:
    - value: false
  subprograms.closures:
    - value: true
      since: "8"
      applies_to: лямбды
      note: "Лямбды захватывают final/effectively final локальные переменные. До лямбд локальные и анонимные внутренние классы уже могли захватывать final-локальные переменные."

  resources.io:
    - value: stdlib
      layer: standard_library
      note: "`System.out.println`, `Scanner`, `BufferedReader` — классы стандартной библиотеки"
  control.until:
    - value: absent
      note: "Предусловие имитируется `while (!cond)`, постусловие — `do { ... } while (!cond)`."
  control.do_while:
    - value: true
  control.iteration:
    - value: c_style
      note: "`for (int i = 0; i < n; i++)`"
    - value: foreach
      since: "5"
      note: "`for (T x : iterable)`"
  scope.globals:
    - value: static_members
      note: "любая переменная — член класса или локальная; эквивалент глобальной — `static`-поле"

  typing.checking:
    - value: static
  typing.inference:
    - value: true
      since: "10"
      profile: local_variables
      applies_to: локальные переменные с var
    - value: true
      since: "5"
      applies_to: аргументы типов при вызове обобщённых методов
    - value: true
      since: "8"
      applies_to: типы параметров лямбды из целевого функционального интерфейса
  typing.compatibility:
    - value: nominal
  typing.sum_types:
    - value: closed_hierarchy
      since: "17"
      applies_to: sealed-иерархии
      sources:
        - {url: "https://openjdk.org/jeps/409", title: "JEP 409: Sealed Classes", retrieved: 2026-09-20}
  typing.product_types:
    - value: record
      applies_to: классы с полями; record-классы в Java 16 и новее
  typing.nullability:
    - value: nullable_everywhere
      note: "любая ссылка может быть `null`; `Optional<T>` (с 8) — библиотечная обёртка, не часть системы типов"
    - value: optional_type
      layer: standard_library
      since: "8"
      note: "`Optional<T>` представляет отсутствие значения, но сама ссылка Optional тоже может быть null."

  memory.management:
    - value: gc
      note: "автоматическое освобождение памяти; конкретный сборщик выбирает реализация JVM, момент освобождения не гарантирован"

  paradigm.supported:
    - value: imperative
    - value: procedural
      note: "статические методы; свободных функций нет"
    - value: object_oriented
      note: "классы, одиночное наследование реализации, интерфейсы"
    - value: functional
      since: "8"
      note: "лямбды, функциональные интерфейсы, Stream API; без функций первого класса вне интерфейсов"

  errors.model:
    - value: exceptions
      note: "try / catch / finally; иерархия от Throwable"
  resources.cleanup:
    - value: finally
    - value: resource_statement
      since: "7"
      applies_to: try-with-resources
      note: "вызывает close для AutoCloseable; прекращение процесса может пропустить очистку"
      sources:
        - {url: "https://openjdk.org/projects/jdk7/features#f618", title: "OpenJDK: JDK 7 — Project Coin (try-with-resources)", retrieved: 2026-09-20}
  errors.checked_exceptions:
    - value: true
      note: "проверяемые исключения объявляются в `throws`; непроверяемые (RuntimeException) — нет"
  errors.must_use:
    - value: absent
      note: "язык не требует использовать возвращённое значение метода"

  subprograms.lambda:
    - value: true
      since: "8"
      note: "лямбда — реализация функционального интерфейса; захватываемые переменные должны быть effectively final"
  subprograms.generics:
    - value: true
      since: "5"
      note: "стирание типов: во время выполнения параметры типов недоступны"
  subprograms.generic_mechanism:
    - value: erasure
      since: "5"
  abstraction.contracts:
    - value: interfaces
  abstraction.dispatch:
    - value: static
      applies_to: статические методы и выбор перегрузки
    - value: single
      applies_to: переопределяемые методы экземпляра
  abstraction.inheritance:
    - value: single
      note: "один суперкласс; интерфейсов может быть несколько, включая default-методы"
  abstraction.modules:
    - value: namespaces
    - value: explicit_exports
      since: "9"
      applies_to: модульная система Java
      sources:
        - {url: "https://openjdk.org/jeps/261", title: "JEP 261: Module System", retrieved: 2026-09-20}
  evaluation.strategy:
    - value: strict
  evaluation.effects:
    - value: unrestricted
      note: "checked exceptions отслеживают часть ошибок, но общей системы эффектов нет"
  evaluation.tail_calls:
    - value: false
  resources.concurrency:
    - value: threads
      layer: standard_library
  syntax.metaprogramming:
    - value: reflection
      layer: standard_library
  subprograms.default_args:
    - value: false
      note: "эквивалент — перегрузка"
  subprograms.named_args:
    - value: false
      note: "эквивалент — паттерн builder"

  syntax.statement_terminator:
    - value: semicolon
  syntax.case_sensitive:
    - value: true
  scope.shadowing:
    - value: forbidden_in_block
      applies_to: локальные переменные
      note: "локальная переменная не может повторить имя другой локальной в охватывающем блоке того же метода"
    - value: allowed
      applies_to: поля и параметры
      note: "локальная переменная или параметр может скрыть поле класса; доступ к полю — через `this`"

