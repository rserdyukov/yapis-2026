id: java
publish: true
default_profile: java21

meta:
  name: Java
  ru: Java
  wikidata: Q251
  pldb: java
  hopl: 2131
  rosetta: Java
  appeared:
    value: 1995
    sources:
      - {url: "https://www.wikidata.org/wiki/Q251", title: "Wikidata P571", retrieved: 2026-09-18}
  designers: [James Gosling]
  organizations: [Sun Microsystems, Oracle]
  website: https://www.oracle.com/java/
  spec: https://docs.oracle.com/javase/specs/
  summary: >
    Объектно-ориентированный язык со статической проверкой типов, сборкой
    мусора и структурными исключениями, компилируемый в байт-код JVM —
    одну из целевых платформ курса. Второй по частоте язык реализации
    компиляторов в практикуме.
    Текущий срез свойств карточки — Java SE 21 без preview-возможностей;
    Java SE 26 в истории выпусков не означает проверки этих свойств для 26.

