examples:
  - role: showcase
    file: Showcase.java

assessment:
  readability:
    text: >
      Явные объявления и типы в сигнатурах помогают читать код,
      но обвязка классов и скобки увеличивают
      объём по сравнению с Python и Kotlin.
    concepts: [bindings.introduction, typing.annotations, syntax.blocks, subprograms.placement]
  writability:
    text: >
      Перегрузка, `var`, лямбды и Stream API сократили код по сравнению с
      ранними версиями; отсутствие свободных функций, параметров по умолчанию
      и множественного присваивания остаётся.
    concepts: [subprograms.overloading, bindings.assignment, subprograms.default_args]
  reliability:
    text: >
      Статическая типизация и проверяемые исключения ловят ошибки на этапе
      компиляции; `null` допустим в ссылочных типах и остаётся одним из
      источников ошибок времени выполнения.
    concepts: [typing.checking, errors.checked_exceptions, typing.nullability]
  cost:
    text: >
      Зрелая экосистема JVM и инструменты; цена — многословность, время
      старта JVM и потребление памяти.
    concepts: [memory.management]
