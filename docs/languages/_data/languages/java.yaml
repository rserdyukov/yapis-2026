assessment:
  readability:
    text: >
      Явные типы в объявлениях и сигнатурах делают код самодокументируемым,
      но многословным: обвязка классов и обязательные скобки увеличивают
      объём по сравнению с Python и Kotlin.
    concepts: [variants.1, variants.5, variants.9]
  writability:
    text: >
      Перегрузка, `var`, лямбды и Stream API сократили код по сравнению с
      ранними версиями; отсутствие свободных функций, параметров по умолчанию
      и множественного присваивания остаётся.
    concepts: [variants.7, variants.3, subprograms.default_args]
  reliability:
    text: >
      Статическая типизация и проверяемые исключения ловят ошибки на этапе
      компиляции; `null` допустим в любой ссылке и остаётся главным
      источником ошибок времени выполнения.
    concepts: [typing.checking, errors.checked, typing.nullability]
  cost:
    text: >
      Зрелая экосистема JVM и инструменты; цена — многословность, время
      старта JVM и потребление памяти.
    concepts: [memory.management]
