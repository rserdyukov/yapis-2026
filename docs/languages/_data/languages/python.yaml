profiles:
  python314: "Python 3.14; базовый профиль языка и стандартной библиотеки. Исторические границы и контексты runtime/static_analysis отмечены отдельно."
  runtime: Семантика выполнения Python без внешней статической проверки.
  static_analysis: Аннотированный Python при проверке mypy или Pyright.

concepts:
  bindings.introduction:
    - value: assignment
      note: "переменная появляется при первом присваивании; аннотация типа (с 3.6) необязательна и интерпретатором не проверяется"
    - value: pattern
      since: "3.10"
      applies_to: захватывающие образцы match
  bindings.mutation:
    - value: rebindable
      note: "повторное присваивание связывает то же имя с новым объектом, не создавая same-scope shadowing"
  typing.annotations:
    - value: optional
      note: "аннотации не обеспечивают проверку типов во время выполнения"
  typing.conversions:
    - value: explicit
      note: "вызов типа-конструктора: `int(s)`, `str(n)`"
    - value: implicit
      applies_to: смешанная числовая арифметика
      note: "int → float при смешанной арифметике может терять точность или вызывать OverflowError. Проверка истинности — отдельный протокол, не перепривязка объекта к bool; строки и числа автоматически не складываются."
  bindings.assignment:
    - value: single
    - value: multiple
      note: "распаковка кортежа: `a, b = b, a`; правая часть вычисляется целиком до присваивания"
  scope.resolution:
    - value: lexical
      note: "область класса имеет особые правила и не служит замыкающим окружением методов"
  scope.constructs:
    - value: subprogram
    - value: module
    - value: class
    - value: comprehension
      note: "в Python 3 переменная обхода comprehension локальна; if/for/while отдельной области не создают"
  syntax.blocks:
    - value: indentation
      note: "двоеточие и отступ; закрывающего символа нет"
  control.selection:
    - value: statement
    - value: expression
      note: "`a if condition else b`"
  control.switch:
    - value: false
  control.pattern_matching:
    - value: false
      until: "3.10"
    - value: true
      since: "3.10"
      note: "`match` — сопоставление с образцом (PEP 634), а не switch по константам"
  subprograms.overloading:
    - value: false
      note: "повторное `def` заменяет предыдущее; диспетчеризация по типу — `functools.singledispatch`"
  subprograms.parameter_passing:
    - value: by_sharing
      note: "передаётся ссылка на объект: изменение изменяемого объекта видно вызывающему, перепривязка имени параметра — нет"
  memory.transfer:
    - value: shared_reference
  subprograms.placement:
    - value: module
    - value: type_member
    - value: local
      note: "вложенные функции образуют замыкания над переменными внешней"
  subprograms.nesting:
    - value: true
  subprograms.closures:
    - value: true

  resources.io:
    - value: builtin
      layer: standard_library
      note: "`input()` и `print()` — встроенные функции, импорт не нужен"
  control.until:
    - value: absent
      note: "Предусловие: `while not cond`; постусловие: `while True` с `if cond: break` после тела."
  control.do_while:
    - value: false
      note: "эквивалент — `while True` с `break` в конце тела"
  control.iteration:
    - value: foreach
      note: "счётный цикл — итерация по `range()`"
    - value: comprehension
  scope.globals:
    - value: module_bindings
      note: "имена уровня модуля; для записи внутри функции — `global`"

  typing.checking:
    - value: dynamic
      profile: runtime
    - value: gradual
      layer: tooling
      profile: static_analysis
      since: "3.5"
      note: "аннотации типов (PEP 484) проверяются внешними инструментами (mypy, pyright), не интерпретатором"
  typing.inference:
    - value: false
      profile: runtime
      note: "интерпретатор не выводит статические типы имён"
    - value: true
      layer: tooling
      profile: static_analysis
      note: "анализатор выводит типы из выражений и потока управления, учитывая аннотации"
  typing.compatibility:
    - value: duck
      profile: runtime
    - value: nominal
      layer: tooling
      profile: static_analysis
      applies_to: обычные классы
    - value: structural
      layer: tooling
      profile: static_analysis
      applies_to: typing.Protocol
  typing.sum_types:
    - value: union
      layer: tooling
      profile: static_analysis
      note: "Union[T, U] или T | U описывают тип для анализатора, не проверяют значение при присваивании"
  typing.product_types:
    - value: tuple
  typing.nullability:
    - value: sentinel
      profile: runtime
      note: "имя может быть связано с None, но операции над None могут быть недопустимы"
    - value: nullable_types
      layer: tooling
      profile: static_analysis
      note: "T | None / Optional[T] явно допускает None; при строгой проверке T сам по себе его не допускает"

  memory.management:
    - value: refcount
      layer: implementation
      implementation: CPython
      note: "подсчёт ссылок; детали отложенного освобождения и бессмертных объектов зависят от версии и сборки, это не гарантия языка Python"
    - value: gc
      layer: implementation
      implementation: CPython
      note: "дополнительный сборщик для циклических ссылок (модуль `gc`)"

  paradigm.supported:
    - value: imperative
    - value: procedural
    - value: object_oriented
    - value: functional
      note: "функции первого класса, замыкания, `map`/`filter`, генераторы; без гарантированного устранения хвостовых вызовов"

  errors.model:
    - value: exceptions
      note: "try / except / else / finally; исключения — классы, иерархия от BaseException"
  resources.cleanup:
    - value: finally
    - value: context_manager
      note: "with вызывает __exit__ при обычном выходе и исключении; аварийное завершение процесса может пропустить очистку"
  errors.checked_exceptions:
    - value: false
  errors.must_use:
    - value: absent
      profile: runtime

  subprograms.lambda:
    - value: true
      note: "`lambda` — только одно выражение; многострочные замыкания — вложенный `def`"
  subprograms.generics:
    - value: true
      layer: tooling
      profile: static_analysis
      since: "3.5"
      note: "`typing.Generic`, `TypeVar`; с 3.12 — синтаксис `def f[T](x: T)`; во время выполнения не проверяются"
  abstraction.contracts:
    - value: protocols
      layer: tooling
      profile: static_analysis
      applies_to: typing.Protocol
  abstraction.dispatch:
    - value: single
      applies_to: поиск метода по классу получателя
    - value: single
      layer: standard_library
      applies_to: functools.singledispatch по первому аргументу
  abstraction.inheritance:
    - value: multiple
  abstraction.modules:
    - value: namespaces
    - value: runtime_modules
  evaluation.strategy:
    - value: strict
      note: "аргументы функции вычисляются перед вызовом; генераторы откладывают выполнение собственного тела"
  evaluation.effects:
    - value: unrestricted
  evaluation.tail_calls:
    - value: false
  resources.concurrency:
    - value: async_await
      since: "3.5"
    - value: threads
      layer: standard_library
    - value: processes
      layer: standard_library
  syntax.metaprogramming:
    - value: reflection
    - value: runtime_code
      note: "eval, exec, создание классов и метаклассы"
  subprograms.default_args:
    - value: true
      note: "значение по умолчанию вычисляется один раз при определении функции"
  subprograms.named_args:
    - value: true

  syntax.statement_terminator:
    - value: newline
      note: "`;` допустима для нескольких операторов в одной строке"
  syntax.case_sensitive:
    - value: true
  scope.shadowing:
    - value: allowed
      note: "локальное имя вложенной функции может скрыть внешнее; повторное присваивание в одной области — перепривязка"

