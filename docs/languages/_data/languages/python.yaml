concepts:
  variants.1:
    - value: implicit
      note: "переменная появляется при первом присваивании; аннотация типа (с 3.6) необязательна и интерпретатором не проверяется"
  variants.2:
    - value: explicit
      note: "вызов типа-конструктора: `int(s)`, `str(n)`"
    - value: implicit
      applies_to: числовая башня и логический контекст
      note: "int → float в арифметике, любое значение → bool в условии; между строками и числами неявного приведения нет"
  variants.3:
    - value: single
    - value: multiple
      note: "распаковка кортежа: `a, b = b, a`; правая часть вычисляется целиком до присваивания"
  variants.4:
    - value: subprograms
      note: "блоки if/for/while новую область не создают; область создают функции, классы и comprehension"
  variants.5:
    - value: implicit
      note: "двоеточие и отступ; закрывающего символа нет"
  variants.6:
    - value: if_only
      until: "3.10"
      note: "до 3.10 — только if/elif/else; многовариантный выбор через словарь или цепочку elif"
    - value: if_and_switch
      since: "3.10"
      note: "`match` — сопоставление с образцом (PEP 634), а не switch по константам"
  variants.7:
    - value: absent
      note: "повторное `def` заменяет предыдущее; диспетчеризация по типу — `functools.singledispatch`"
  variants.8:
    - value: by_sharing
      note: "передаётся ссылка на объект: изменение изменяемого объекта видно вызывающему, перепривязка имени параметра — нет"
  variants.9:
    - value: anywhere
      note: "вложенные функции образуют замыкания над переменными внешней"

  req.4:
    - value: builtin
      note: "`input()` и `print()` — встроенные функции, импорт не нужен"
  req.7.2.until:
    - value: false
      note: "эквивалент — `while not cond` или `while True` с `break`"
  req.7.2.do_while:
    - value: false
      note: "эквивалент — `while True` с `break` в конце тела"
  req.7.3:
    - value: foreach
      note: "счётный цикл — итерация по `range()`"
  req.8.2:
    - value: globals
      note: "имена уровня модуля; для записи внутри функции — `global`"

  typing.checking:
    - value: dynamic
    - value: gradual
      since: "3.5"
      note: "аннотации типов (PEP 484) проверяются внешними инструментами (mypy, pyright), не интерпретатором"
  typing.strength:
    - value: strong
      note: "`'1' + 2` — TypeError; неявного приведения между строками и числами нет"
  typing.inference:
    - value: false
      note: "у переменных нет статических типов, выводить нечего; статические анализаторы выводят типы из аннотаций"
  typing.nullability:
    - value: nullable_everywhere
      note: "`None` — обычный объект, допустим где угодно; `Optional[T]` — только аннотация"

  memory.management:
    - value: refcount
      note: "подсчёт ссылок в CPython; объект освобождается при обнулении счётчика"
    - value: gc
      note: "дополнительный сборщик для циклических ссылок (модуль `gc`)"

  paradigm.supported:
    - value: imperative
    - value: procedural
    - value: object_oriented
    - value: functional
      note: "функции первого класса, замыкания, `map`/`filter`, генераторы; без хвостовой рекурсии и неизменяемости по умолчанию"

  errors.model:
    - value: exceptions
      note: "try / except / else / finally; исключения — классы, иерархия от BaseException"
  errors.finally:
    - value: true
      note: "`finally`, а также контекстные менеджеры `with`"
  errors.checked:
    - value: false

  subprograms.lambda:
    - value: true
      note: "`lambda` — только одно выражение; многострочные замыкания — вложенный `def`"
  subprograms.generics:
    - value: true
      since: "3.5"
      note: "`typing.Generic`, `TypeVar`; с 3.12 — синтаксис `def f[T](x: T)`; во время выполнения не проверяются"
  subprograms.default_args:
    - value: true
      note: "значение по умолчанию вычисляется один раз при определении функции"
  subprograms.named_args:
    - value: true

  syntax.statement_terminator:
    - value: newline
      note: "`;` допустима для нескольких операторов в одной строке"
  syntax.case_sensitive:
    - value: true
  syntax.shadowing:
    - value: allowed
      note: "вложенная функция может переопределить имя внешней; предупреждений нет"
    - value: allowed_same_scope
      note: "повторное присваивание — это перепривязка того же имени, а не новое объявление"

