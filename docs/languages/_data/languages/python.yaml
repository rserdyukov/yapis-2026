examples:
  - role: showcase
    file: showcase.py

assessment:
  readability:
    text: >
      Отступы вместо скобок и минимум служебных слов делают код коротким и
      единообразным; отсутствие типов в сигнатурах затрудняет чтение больших
      программ, аннотации частично это компенсируют.
    concepts: [syntax.blocks, bindings.introduction, typing.annotations]
  writability:
    text: >
      Неявное объявление, множественное присваивание, встроенные коллекции и
      ввод-вывод без импорта — программа пишется быстро; ошибки типов
      откладываются до запуска.
    concepts: [bindings.introduction, bindings.assignment, resources.io]
  reliability:
    text: >
      Попытка сложения строки и числа вызывает TypeError во время
      выполнения; надёжность держится на тестах и внешних проверках
      аннотаций. Исключения структурные, с `finally` и `with`.
    concepts: [typing.checking, typing.conversions, errors.model, resources.cleanup]
  cost:
    text: >
      Низкий порог входа, огромная экосистема; цена — скорость выполнения и
      расходы на тесты вместо компилятора.
    concepts: [memory.management]
