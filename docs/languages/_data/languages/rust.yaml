assessment:
  readability:
    text: >
      Синтаксис явный и единообразный (скобки, `let`, типы в сигнатурах), но
      аннотации времён жизни и обобщений с ограничениями трейтов делают
      сигнатуры длинными; для новичка — самый сложный из языков каталога.
    concepts: [variants.1, variants.5, typing.inference]
  writability:
    text: >
      Вывод типов внутри функций и выражения-блоки сокращают код, но
      проверка заимствований заставляет заранее продумывать владение
      данными; высокая «входная цена».
    concepts: [variants.8, memory.management]
  reliability:
    text: >
      Статическая сильная типизация, отсутствие null, обязательная обработка
      `Result` и проверка владения исключают целые классы ошибок на этапе
      компиляции.
    concepts: [typing.checking, typing.nullability, errors.model, errors.checked, memory.management]
  cost:
    text: >
      Дольше учить и дольше компилировать; окупается там, где критичны
      производительность и безопасность памяти без сборщика мусора.
    concepts: [memory.management]
