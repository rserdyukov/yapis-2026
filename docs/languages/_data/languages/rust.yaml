concepts:
  variants.1:
    - value: explicit
      note: "ключевое слово `let`; тип указывается или выводится компилятором; без `mut` переменная неизменяема"
  variants.2:
    - value: explicit
      note: "`as` для примитивов, `From`/`Into`, `parse`; арифметика между i32 и f64 без приведения — ошибка компиляции"
  variants.3:
    - value: single
    - value: multiple
      since: "1.59"
      note: "деструктуризация кортежа: `(a, b) = (b, a)`; при объявлении `let (a, b) = …` — с 1.0"
  variants.4:
    - value: subprograms_and_blocks
      note: "любой блок `{ }` — область видимости; блок — выражение"
  variants.5:
    - value: explicit
      note: "фигурные скобки обязательны даже для одного оператора"
  variants.6:
    - value: if_and_switch
      note: "`if`/`else if`/`else` и `match` — сопоставление с образцом с проверкой полноты; оба — выражения"
  variants.7:
    - value: absent
      note: "две `fn` с одним именем в одной области — ошибка; полиморфизм — через трейты и обобщения"
  variants.8:
    - value: by_value
      applies_to: типы с трейтом Copy (числа, bool, char, ссылки)
    - value: move
      applies_to: остальные типы
      note: "после вызова исходная переменная недоступна — компилятор запрещает использование"
    - value: borrow
      note: "`&T` — разделяемая ссылка только на чтение; таких ссылок может быть несколько"
    - value: borrow_mut
      note: "`&mut T` — единственная ссылка с правом записи; проверяется компилятором (borrow checker)"
  variants.9:
    - value: anywhere
      note: "вложенная `fn` не захватывает переменные внешней; для этого — замыкания `|x| …`"

  req.4:
    - value: macro
      applies_to: вывод
      note: "`println!`, `print!`, `eprintln!` — макросы стандартной библиотеки"
    - value: stdlib
      applies_to: ввод
      note: "`std::io::stdin().read_line(&mut s)` и `parse`; встроенных функций ввода нет"
  req.7.2.until:
    - value: false
      note: "эквивалент — `while !cond`"
  req.7.2.do_while:
    - value: false
      note: "эквивалент — `loop { …; if cond { break } }`"
  req.7.3:
    - value: foreach
      note: "`for x in iter`; счётный цикл — диапазон `0..n`"
  req.8.2:
    - value: globals
      note: "`static`; изменение `static mut` требует `unsafe`, обычно используют атомики или `Mutex`"

  typing.checking:
    - value: static
  typing.strength:
    - value: strong
      note: "неявных приведений между числовыми типами нет"
  typing.inference:
    - value: true
      note: "локальный вывод (Hindley–Milner-подобный) внутри функции; сигнатуры функций аннотируются явно"
  typing.nullability:
    - value: optional_type
      note: "`Option<T>`; null-ссылок в безопасном коде нет"

  memory.management:
    - value: ownership
      note: "владение, перемещение, заимствование и времена жизни проверяются компилятором; освобождение — при выходе владельца из области (`Drop`)"
    - value: refcount
      applies_to: разделяемое владение
      note: "`Rc<T>` / `Arc<T>` — явно, по выбору программиста"

  paradigm.supported:
    - value: imperative
    - value: procedural
    - value: functional
      note: "замыкания, итераторы, `map`/`filter`, алгебраические типы, сопоставление с образцом"
    - value: object_oriented
      note: "структуры + трейты; наследования реализации нет — композиция и обобщения"

  errors.model:
    - value: result_type
      note: "`Result<T, E>` и `Option<T>`, оператор `?` для проброса; `panic!` — для невосстановимых ошибок, не для управления потоком"
  errors.finally:
    - value: false
      note: "освобождение ресурсов — через `Drop` при выходе из области (RAII), отдельного `finally` нет"
  errors.checked:
    - value: true
      note: "тип ошибки — часть сигнатуры `fn f() -> Result<T, E>`; игнорировать `Result` без `#[must_use]`-предупреждения нельзя"

  subprograms.lambda:
    - value: true
      note: "замыкания `|x| x + 1`; три трейта `Fn`/`FnMut`/`FnOnce` по способу захвата"
  subprograms.generics:
    - value: true
      note: "мономорфизация во время компиляции; ограничения через трейты (`T: Display`)"
  subprograms.default_args:
    - value: false
      note: "эквивалент — `Option<T>` в параметре или паттерн builder"
  subprograms.named_args:
    - value: false
      note: "эквивалент — структура-параметр"

  syntax.statement_terminator:
    - value: semicolon
      note: "`;` превращает выражение в оператор; последнее выражение блока без `;` — его значение"
  syntax.case_sensitive:
    - value: true
  syntax.shadowing:
    - value: allowed
    - value: allowed_same_scope
      note: "повторный `let x` в той же области создаёт новую переменную (идиома для смены типа)"

