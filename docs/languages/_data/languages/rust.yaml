profiles:
  rust2024: "Rust, edition 2024; базовый профиль языка и стандартной библиотеки. Редакция языка не равна номеру выпуска rustc; исторические границы и контексты safe/locals/signatures отмечены отдельно."
  safe: Безопасный Rust без unsafe-операций.
  locals: Локальные связывания и замыкания с выводом типов.
  signatures: Сигнатуры именованных функций.

concepts:
  bindings.introduction:
    - value: explicit
      note: "ключевое слово `let`; тип указывается или выводится компилятором; без `mut` переменная неизменяема"
    - value: pattern
      applies_to: let и образцы match
  bindings.mutation:
    - value: immutable
      note: "по умолчанию; внутренняя изменяемость объекта не равна перепривязке имени"
    - value: rebindable
      applies_to: let mut
  typing.annotations:
    - value: optional
      profile: locals
    - value: required
      profile: signatures
  typing.conversions:
    - value: explicit
      note: "`as` для примитивов, `From`/`Into`, `parse`; арифметика между i32 и f64 без приведения — ошибка компиляции"
    - value: implicit
      applies_to: разрешённые позиции coercion
      note: "ограниченные coercions, например &mut T → &T, &[T; N] → &[T], deref coercion; не произвольное числовое расширение"
  bindings.assignment:
    - value: single
    - value: multiple
      since: "1.59"
      note: "деструктуризация кортежа: `(a, b) = (b, a)`; при объявлении `let (a, b) = …` — с 1.0"
  scope.resolution:
    - value: lexical
  scope.constructs:
    - value: subprogram
    - value: module
    - value: block
      note: "любой блок `{ }` — область видимости; блок — выражение"
  syntax.blocks:
    - value: explicit
      note: "фигурные скобки обязательны даже для одного оператора"
  control.selection:
    - value: expression
      note: "`if`/`else if`/`else` и `match` — сопоставление с образцом с проверкой полноты; оба — выражения"
  control.switch:
    - value: false
  control.pattern_matching:
    - value: true
  subprograms.overloading:
    - value: false
      note: "две `fn` с одним именем в одной области — ошибка; полиморфизм — через трейты и обобщения"
  subprograms.parameter_passing:
    - value: by_value
      note: "аргумент передаёт значение; это относится и к значениям ссылок. Копирование, перемещение и заимствование — отдельная ось."
  memory.transfer:
    - value: copy
      applies_to: типы Copy, включая &T, но не &mut T
    - value: move
      applies_to: передача принадлежащего вызывающему значения не-Copy типа
      note: "после вызова исходная переменная недоступна — компилятор запрещает использование"
    - value: shared_borrow
      profile: safe
      note: "&T допускает разделяемый доступ; изменение через внутреннюю изменяемость (например Cell/Mutex) возможно"
    - value: exclusive_borrow
      profile: safe
      note: "&mut T даёт исключительный доступ на время активного заимствования; возможны временные reborrow"
  subprograms.placement:
    - value: module
    - value: type_member
    - value: local
      note: "вложенная `fn` не захватывает переменные внешней; для этого — замыкания `|x| …`"
  subprograms.nesting:
    - value: true
  subprograms.closures:
    - value: true

  resources.io:
    - value: macro
      layer: standard_library
      applies_to: вывод
      note: "`println!`, `print!`, `eprintln!` — макросы стандартной библиотеки"
    - value: stdlib
      layer: standard_library
      applies_to: ввод
      note: "`std::io::stdin().read_line(&mut s)` и `parse`; встроенных функций ввода нет"
  control.until:
    - value: absent
      note: "Предусловие: `while !cond`; постусловие: `loop { ...; if cond { break } }`."
  control.do_while:
    - value: false
      note: "do-while(cond) имитируется `loop { ...; if !cond { break } }`"
  control.iteration:
    - value: foreach
      note: "`for x in iter`; счётный цикл — диапазон `0..n`"
  scope.globals:
    - value: module_bindings
      note: "`static`; изменение `static mut` требует `unsafe`, обычно используют атомики или `Mutex`"

  typing.checking:
    - value: static
  typing.inference:
    - value: true
      profile: locals
      note: "локальный вывод (Hindley–Milner-подобный) внутри функции; сигнатуры функций аннотируются явно"
  typing.compatibility:
    - value: nominal
      applies_to: struct, enum и явные реализации trait
    - value: structural
      applies_to: кортежи и типы указателей на функции
  typing.sum_types:
    - value: tagged
      note: "enum с данными вариантов"
  typing.product_types:
    - value: tuple
    - value: record
  typing.nullability:
    - value: optional_type
      layer: standard_library
      profile: safe
      note: "`Option<T>`; null-ссылок в безопасном коде нет"

  memory.management:
    - value: ownership
      profile: safe
      note: "владение, перемещение, заимствование и времена жизни проверяются компилятором; освобождение — при выходе владельца из области (`Drop`)"
    - value: refcount
      layer: standard_library
      applies_to: разделяемое владение
      note: "`Rc<T>` / `Arc<T>` — явно, по выбору программиста"

  paradigm.supported:
    - value: imperative
    - value: procedural
    - value: functional
      note: "замыкания, итераторы, `map`/`filter`, алгебраические типы, сопоставление с образцом"
    - value: object_oriented
      note: "структуры + трейты; наследования реализации нет — композиция и обобщения"

  errors.model:
    - value: result_type
      layer: standard_library
      note: "`Result<T, E>` представляет успех или ошибку; оператор ? распространяет ошибку. `Option<T>` представляет отсутствие значения, а не отдельный тип ошибки."
    - value: panic
      note: "panic! запускает unwinding либо abort в зависимости от конфигурации; это отдельный от Result канал"
  resources.cleanup:
    - value: raii
      note: "Drop при обычном выходе из области и unwinding; abort, утечка или mem::forget могут пропустить деструктор"
  errors.checked_exceptions:
    - value: false
      note: "Result — возвращаемое значение, не checked exception; требований catch/throws нет"
  errors.must_use:
    - value: warning
      applies_to: "значения типов и функций с #[must_use], в частности Result"
      note: "unused_must_use по умолчанию предупреждение; `let _ = result;` явно отбрасывает результат. Уровень lint настраивается."

  subprograms.lambda:
    - value: true
      note: "замыкания `|x| x + 1`; три трейта `Fn`/`FnMut`/`FnOnce` по способу захвата"
  subprograms.generics:
    - value: true
      note: "мономорфизация во время компиляции; ограничения через трейты (`T: Display`)"
  subprograms.generic_mechanism:
    - value: monomorphization
      layer: implementation
      implementation: rustc
  abstraction.contracts:
    - value: traits
  abstraction.dispatch:
    - value: static
      applies_to: обобщённые функции с ограничениями trait
    - value: single
      applies_to: вызовы через dyn Trait
  abstraction.inheritance:
    - value: absent
      note: "supertraits выражают ограничения, а не наследование полей и реализации класса"
  abstraction.modules:
    - value: namespaces
    - value: explicit_exports
      note: "mod, pub и pub use"
  evaluation.strategy:
    - value: strict
  evaluation.effects:
    - value: unrestricted
      note: "владение и Send/Sync ограничивают отдельные операции, но общей системы чистых и эффектных функций нет"
  evaluation.tail_calls:
    - value: false
  resources.concurrency:
    - value: threads
      layer: standard_library
    - value: message_passing
      layer: standard_library
    - value: async_await
      note: "синтаксис языка; исполнитель Future выбирается отдельно"
  syntax.metaprogramming:
    - value: syntactic_macros
      note: "macro_rules!"
    - value: procedural_macros
    - value: compile_time_execution
      note: "const-выражения и const fn с ограничениями"
  subprograms.default_args:
    - value: false
      note: "эквивалент — `Option<T>` в параметре или паттерн builder"
  subprograms.named_args:
    - value: false
      note: "эквивалент — структура-параметр"

  syntax.statement_terminator:
    - value: semicolon
      note: "`;` превращает выражение в оператор; последнее выражение блока без `;` — его значение"
  syntax.case_sensitive:
    - value: true
  scope.shadowing:
    - value: allowed
    - value: allowed_same_scope
      note: "повторный `let x` в той же области создаёт новую переменную (идиома для смены типа)"

