id: rust
publish: true
default_profile: rust2024

meta:
  name: Rust
  ru: Rust
  wikidata: Q575650
  pldb: rust
  rosetta: Rust
  appeared:
    value: 2010
    sources:
      - {url: "https://pldb.io/concepts/rust.html", title: "PLDB appeared", retrieved: 2026-09-18}
      - {url: "https://www.wikidata.org/wiki/Q575650", title: "Wikidata P571 (2006 — начало разработки)", retrieved: 2026-09-18}
  designers: [Graydon Hoare]
  organizations: [Mozilla Research, Rust Foundation]
  website: https://www.rust-lang.org/
  spec: https://doc.rust-lang.org/reference/
  summary: >
    Компилируемый язык со статической проверкой типов, управлением памятью
    через владение и заимствование без сборщика мусора и обработкой ошибок
    через значения `Result`. Компилируется через LLVM — одну из целевых
    платформ курса.

