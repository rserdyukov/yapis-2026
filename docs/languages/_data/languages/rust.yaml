examples:
  - role: showcase
    file: showcase.rs

assessment:
  readability:
    text: >
      Синтаксис явный и единообразный (скобки, `let`, типы в сигнатурах), но
      аннотации времён жизни и обобщений с ограничениями трейтов делают
      сигнатуры длинными и требуют изучения дополнительных понятий.
    concepts: [bindings.introduction, syntax.blocks, typing.inference]
  writability:
    text: >
      Вывод типов внутри функций и выражения-блоки сокращают код, но
      проверка заимствований заставляет заранее продумывать владение
      данными; высокая «входная цена».
    concepts: [subprograms.parameter_passing, memory.transfer, memory.management]
  reliability:
    text: >
      Статическая проверка типов, ненулевые ссылки и проверка владения
      предотвращают многие ошибки памяти в безопасном коде. Result явно
      представляет ошибку; предупреждение о неиспользованном результате
      допускает явное отбрасывание и не гарантирует обработку ошибки.
    concepts: [typing.checking, typing.nullability, errors.model, errors.must_use, memory.management]
  cost:
    text: >
      Дольше учить и дольше компилировать; окупается там, где критичны
      производительность и безопасность памяти без сборщика мусора.
    concepts: [memory.management]
