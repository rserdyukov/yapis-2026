  - id: resources
    ru: Ресурсы и взаимодействие
    en: Resources and interaction
    concepts:
      - id: resources.cleanup
        slug: resources-cleanup
        legacy_slugs: [errors-finally]
        ru: Освобождение ресурсов
        en: Resource cleanup
        kind: choice
        values:
          - {id: finally, ru: Блок finally / unwind-protect, en: finally / unwind-protect}
          - {id: context_manager, ru: Контекстный менеджер, en: context manager}
          - {id: resource_statement, ru: Конструкция управления ресурсом, en: resource-management statement}
          - {id: raii, ru: Деструктор при выходе из области, en: scope-bound destruction}
          - {id: defer, ru: Отложенный вызов при выходе, en: deferred scope-exit call}
          - {id: manual, ru: Явное освобождение, en: manual release}
        note: "Гарантии зависят от пути выхода; аварийное завершение процесса может пропустить очистку."
      - id: resources.io
        slug: resources-io
        legacy_slugs: [req-4]
        ru: Интерфейс ввода-вывода
        en: I/O interface
        kind: choice
        values:
          - {id: builtin, ru: Встроенные функции, en: built-in functions}
          - {id: stdlib, ru: API стандартной библиотеки, en: standard-library API}
          - {id: macro, ru: Макросы, en: macros}
      - id: resources.concurrency
        slug: resources-concurrency
        ru: Конкурентное выполнение
        en: Concurrency
        kind: choice
        values:
          - {id: threads, ru: Потоки, en: threads}
          - {id: async_await, ru: Асинхронные корутины, en: async/await coroutines}
          - {id: actors, ru: Акторы, en: actors}
          - {id: message_passing, ru: Передача сообщений, en: message passing}
          - {id: processes, ru: Процессы, en: processes}
      - id: resources.communication_coupling
        slug: resources-communication-coupling
        ru: Синхронизация отправки и приёма
        en: Send and receive coupling
        kind: choice
        note: "Асинхронная отправка в mailbox не требует одновременного receive; rendezvous завершает коммуникацию при встрече отправителя и получателя по небуферизованному каналу. Это не выбор сообщения, не модель времени и не гарантия доставки/fairness. Свидетели — Erlang/OTP и occam 2; scheduler архивного occam runtime не обобщается на язык."
        values:
          - {id: asynchronous_mailbox, ru: Асинхронная отправка в почтовый ящик, en: asynchronous mailbox send}
          - {id: synchronous_rendezvous, ru: Синхронное рандеву по каналу, en: synchronous channel rendezvous}
        sources:
          - {url: "https://www.erlang.org/doc/system/conc_prog.html", title: "Erlang/OTP — Concurrent Programming: send and receive"}
          - {url: "https://www.transputer.net/obooks/sw-0064-4/sw-0064-4.html", title: "INMOS occam Run-time Model Specification SW-0064-4 §3 — synchronized unbuffered channels"}
      - id: resources.receive_selection
        slug: resources-receive-selection
        ru: Выбор сообщения из очереди
        en: Message selection from a queue
        kind: choice
        note: "Selective receive ищет первое подходящее сообщение, сохраняя более ранние неподходящие; head-only допускает извлечение только головы очереди. Асинхронный mailbox сам по себе не задаёт эту политику. Значение head_only — контраст для документирования, а не утверждение об occam: к rendezvous без очереди эта ось неприменима."
        values:
          - {id: head_only, ru: Только голова очереди, en: queue head only}
          - {id: selective_matching, ru: Выбор по образцу с пропуском неподходящих, en: selective matching}
        sources:
          - {url: "https://www.erlang.org/doc/system/conc_prog.html", title: "Erlang/OTP — Concurrent Programming: selective receive and retained messages"}

