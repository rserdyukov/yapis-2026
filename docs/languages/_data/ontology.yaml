        en: Method dispatch
        en_aliases: [static dispatch, dynamic dispatch, virtual functions, multiple dispatch]
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/virtual", title: "virtual function specifier"}
