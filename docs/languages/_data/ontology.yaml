  - id: data
    ru: Семантика данных
    en: Data semantics
    concepts:
      - id: data.collection_multiplicity
        slug: data-collection-multiplicity
        ru: Кратность элементов коллекции
        en: Collection multiplicity
        kind: choice
        note: "Set хранит присутствие элемента, bag — число вхождений, sequence — отдельные позиционные вхождения. Ось задаёт модель конкретной коллекции или результата операции, а не всех данных языка: SQL SELECT ALL сохраняет дубли, DISTINCT устраняет их. Порядок выдачи строк и ORDER BY описываются отдельно; SQL bag не превращается в sequence из-за порядка конкретного плана."
        values:
          - {id: set, ru: Множество без дубликатов, en: set}
          - {id: bag, ru: Мультимножество с кратностями, en: bag or multiset}
          - {id: sequence, ru: Последовательность позиционных вхождений, en: sequence of positional occurrences}
        sources:
          - {url: "https://souffle-lang.github.io/relations", title: "Soufflé — Relations as sets of tuples"}
          - {url: "https://www.postgresql.org/docs/18/queries-select-lists.html", title: "PostgreSQL 18 — Select Lists: ALL and DISTINCT"}
          - {url: "https://docs.python.org/3/library/stdtypes.html#sequence-types-list-tuple-range", title: "Python 3 — Sequence Types"}
      - id: data.numeric_radix
        slug: data-numeric-radix
        ru: Основание числового представления
        en: Numeric representation radix
        kind: choice
        note: "Binary/decimal относится к представлению и арифметике конкретного числового типа, а не к записи литерала. Основание независимо от точности и fixed/floating scale: десятичное число не обязательно имеет фиксированный масштаб. COBOL PICTURE с V задаёт десятичные позиции и подразумеваемую точку; Python float — двоичное представление."
        values:
          - {id: binary, ru: Двоичное, en: binary}
          - {id: decimal, ru: Десятичное, en: decimal}
        sources:
          - {url: "https://gnucobol.sourceforge.io/HTML/gnucobpg.html", title: "GnuCOBOL 3.1 RC-1 Programmer's Guide §6.9.33 — PICTURE and V scale"}
          - {url: "https://docs.python.org/3/library/stdtypes.html#additional-methods-on-float", title: "Python 3 — binary float representation and hex conversion"}
      - id: data.numeric_precision
        slug: data-numeric-precision
        ru: Ограничение числовой точности
        en: Numeric precision bound
        kind: choice
        note: "Fixed precision ограничивает число разрядов выбранным типом/объявлением; arbitrary precision позволяет увеличивать его по значению или настраиваемому контексту в пределах ресурсов. Это не fixed point: положение точки, rounding и overflow описываются отдельно. Python int точен без фиксированной разрядности, decimal.Decimal использует контекст точности стандартной библиотеки; COBOL PIC ограничивает число позиций поля."
        values:
          - {id: fixed_precision, ru: Фиксированная разрядность типа или поля, en: fixed type or field precision}
          - {id: arbitrary_precision, ru: Нефиксированная заранее разрядность, en: arbitrary precision}
        sources:
          - {url: "https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex", title: "Python 3 — unlimited-precision integers and user-definable Decimal precision"}
          - {url: "https://gnucobol.sourceforge.io/HTML/gnucobpg.html", title: "GnuCOBOL 3.1 RC-1 Programmer's Guide §6.9.33 — numeric PICTURE"}

  - id: computation
    ru: Правила вычисления и модели времени
    en: Computation rules and time models
    concepts:
      - id: computation.rule_semantics
        slug: computation-rule-semantics
        ru: Смысл применения правил
        en: Rule application semantics
        kind: choice
        note: "Поиск решает заданную цель, fixed-point deduction задаёт замыкание отношений, committed rewriting меняет store без возврата к отвергнутому правилу. Это семантика конкретного ядра/профиля, не алгоритм реализации: top-down/bottom-up и tabling не подменяют определение результата. Наименьшая неподвижная точка здесь относится к положительному конечному Datalog без порождения новых значений; CHR может удалять ограничения и не обязан вычислять такое замыкание."
        values:
          - {id: goal_search, ru: Поиск решений заданной цели, en: goal-directed solution search}
          - {id: least_fixed_point, ru: Наименьшее замыкание отношений, en: least fixed-point deduction}
          - {id: committed_rewriting, ru: Переписывание хранилища с фиксацией выбора, en: committed store rewriting}
        sources:
          - {url: "https://www.mercurylang.org/information/doc-release/mercury_ref/Determinism-categories.html", title: "Mercury Reference Manual — goal solutions and determinism"}
          - {url: "https://microsoft.github.io/z3guide/docs/fixedpoints/basicdatalog/", title: "Z3 Guide — Basic Datalog fixed-point engine"}
          - {url: "https://souffle-lang.github.io/tutorial", title: "Soufflé Tutorial — recursive relations and arithmetic extension limits"}
          - {url: "https://www.swi-prolog.org/pldoc/man?section=chr-syntaxandsemantics", title: "SWI-Prolog CHR — simplification, propagation and simpagation"}
      - id: computation.instantiation_modes
        slug: computation-instantiation-modes
        ru: Режимы связанности аргументов
        en: Argument instantiation modes
        kind: choice
        note: "Режим описывает состояние аргумента до и после вызова: например, Mercury in соответствует ground→ground, out — free→ground. Mode mapping независим от типа, by-reference передачи и числа решений. Точные допустимые структуры inst и ограничения реализации задаются в профиле."
        values:
          - {id: ground_to_ground, ru: Связанный вход остаётся связанным, en: ground to ground}
          - {id: free_to_ground, ru: Свободный аргумент становится связанным, en: free to ground}
          - {id: declared_transition, ru: Пользовательское отображение состояний inst, en: declared instantiation transition}
        sources:
          - {url: "https://www.mercurylang.org/information/doc-release/mercury_ref/Insts-modes-and-mode-definitions.html", title: "Mercury Reference Manual — Insts, modes and mode definitions"}
      - id: computation.solution_cardinality
        slug: computation-solution-cardinality
        ru: Объявленная кратность решений
        en: Declared solution cardinality
        kind: choice
        note: "Классификация числа решений и допустимости failure относится к конкретному mode вызова. Mercury det — одно решение, semidet — ноль или одно, multi — одно или больше, nondet — ноль или больше. Гарантия условна для возвращающихся вызовов: det не доказывает завершение, отсутствие исключений или детерминированный порядок планирования потоков."
        values:
          - {id: det, ru: Ровно одно решение, en: exactly one solution}
          - {id: semidet, ru: Ноль или одно решение, en: zero or one solution}
          - {id: multi, ru: Одно или больше решений, en: one or more solutions}
          - {id: nondet, ru: Ноль или больше решений, en: zero or more solutions}
        sources:
          - {url: "https://www.mercurylang.org/information/doc-release/mercury_ref/Determinism-categories.html", title: "Mercury Reference Manual — Determinism categories and returning-call qualification"}
      - id: computation.time_domain
        slug: computation-time-domain
        ru: Временная область модели
        en: Model time domain
        kind: choice
        note: "Логические такты потоков Lustre, дискретное время HDL-симуляции и непрерывная динамика с событиями Modelica — разные смыслы времени. Hybrid сочетает непрерывную эволюцию и дискретные события. Область времени не определяет deadline реального времени, rendezvous, scheduler или реализуемость модели; при отсутствии встроенного времени нужна контекстная запись, а не вывод по пропуску данных."
        values:
          - {id: logical_ticks, ru: Дискретные логические такты, en: discrete logical ticks}
          - {id: discrete_simulation, ru: Дискретное время симуляции, en: discrete simulation time}
          - {id: continuous, ru: Непрерывное модельное время, en: continuous model time}
          - {id: hybrid, ru: Непрерывная динамика и дискретные события, en: hybrid continuous and discrete time}
        sources:
          - {url: "https://www-verimag.imag.fr/The-Lustre-Programming-Language-and.html", title: "Verimag — Lustre clocked streams"}
          - {url: "https://specification.modelica.org/maint/3.6/equations.html", title: "Modelica Specification 3.6 §8 — continuous integration and events"}
          - {url: "https://steveicarus.github.io/iverilog/usage/simulation.html", title: "Icarus Verilog — discrete-event simulation"}
      - id: computation.equation_causality
        slug: computation-equation-causality
        ru: Направленность уравнений и присваиваний
        en: Equation and assignment causality
        kind: choice
        note: "Присваивание обновляет выбранную цель; направленное уравнение потока задаёт выход через входы; ненаправленная система уравнений задаёт отношения для совместного решения. Modelica equation с = не является algorithm assignment с :=. Уравнения не обещают существования или единственности решения; Lustre clocks и HDL очереди обновлений описываются отдельными осями."
        values:
          - {id: directed_assignment, ru: Направленное обновление цели, en: directed assignment}
          - {id: directed_equation, ru: Направленное определение потока, en: directed stream equation}
          - {id: acausal_equation, ru: Ненаправленное отношение для совместного решения, en: acausal simultaneous equation}
        sources:
          - {url: "https://www-verimag.imag.fr/The-Lustre-Programming-Language-and.html", title: "Verimag — Lustre unordered stream equations"}
          - {url: "https://specification.modelica.org/maint/3.6/equations.html", title: "Modelica Specification 3.6 §8 — equations versus assignments"}
      - id: computation.update_scheduling
        slug: computation-update-scheduling
        ru: Планирование обновлений в HDL-симуляции
        en: HDL simulation update scheduling
        kind: choice
        note: "В процедурном Verilog blocking assignment без задержки обновляет цель перед следующим оператором; nonblocking assignment вычисляет RHS и планирует применение значения позже. Ось описывает симуляционное обновление, не форму множественного присваивания и не порядок потоков. Источник — Icarus; точные IEEE event regions, delays и synthesizable subset требуют отдельного версионного профиля."
        values:
          - {id: blocking_update, ru: Блокирующее процедурное обновление, en: blocking procedural update}
          - {id: deferred_nonblocking, ru: Отложенное неблокирующее обновление, en: deferred nonblocking update}
        sources:
          - {url: "https://steveicarus.github.io/iverilog/usage/simulation.html", title: "Icarus Verilog — Simulation"}
          - {url: "https://steveicarus.github.io/iverilog/developer/guide/vvp/vvp.html", title: "Icarus VVP Simulation Engine — blocking and nonblocking assignment events"}

  - id: verification
    ru: Проверяемые свойства программ
    en: Program verification properties
    concepts:
      - id: verification.totality
        slug: verification-totality
        ru: Режим гарантии тотальности
        en: Totality guarantee policy
        kind: choice
        note: "Ось задаёт обязательность проверки тотальности для определения/профиля, а не наличие dependent types. Нужно явно назвать проверяемые обязательства: coverage, termination либо productivity для corecursion. Idris 2 covering не равен total; Agda допускает отключения/утверждения вне safe-профиля. Принятая через escape hatch тотальность не считается доказанной; checked_required относится лишь к области, где профиль действительно требует все заявленные проверки."
        values:
          - {id: checked_required, ru: Проверка обязательна в указанной области, en: checking required in the stated scope}
          - {id: checked_opt_in, ru: Проверка включается для определения или профиля, en: opt-in checking for a definition or profile}
          - {id: unchecked_escape, ru: Непроверенное допущение или обход проверки, en: unchecked assumption or escape hatch}
          - {id: partial_allowed, ru: Частичные определения разрешены, en: partial definitions allowed}
        sources:
          - {url: "https://idris2.readthedocs.io/en/latest/tutorial/typesfuns.html", title: "Idris 2 — covering, total, partial and Totality"}
          - {url: "https://agda.readthedocs.io/en/latest/language/termination-checking.html", title: "Agda — Termination Checking, TERMINATING, NON_TERMINATING and --safe"}
      - id: verification.behavioral_contracts
        slug: verification-behavioral-contracts
        ru: Поведенческие контракты
        en: Behavioral contracts
        kind: choice
        note: "Предикаты допустимого входа, результата/перехода состояния и инвариантов объекта. Это не abstraction.contracts: interfaces/traits задают контракт полиморфизма, а не такие предикаты. Наличие require/ensure/Pre/Post не означает доказательство: runtime monitoring, assertion policy и статический proof tool фиксируются отдельно с layer/profile; old обозначает состояние до вызова."
        values:
          - {id: preconditions, ru: Предусловия, en: preconditions}
          - {id: postconditions, ru: Постусловия, en: postconditions}
          - {id: invariants, ru: Инварианты объектов, en: object invariants}
        sources:
          - {url: "https://www.eiffel.org/doc/eiffel/ET-_Design_by_Contract_(tm),_Assertions_and_Exceptions", title: "Eiffel — Design by Contract: assertions, old and monitoring"}
          - {url: "https://www.adaic.org/resources/add_content/standards/12rm/html/RM-6-1-1.html", title: "Ada 2012 RM §6.1.1 — preconditions, postconditions and assertion policy"}
          - {url: "https://docs.adacore.com/spark2014-docs/html/ug/en/spark_2014.html", title: "SPARK User's Guide — language subset, contracts and GNATprove boundaries"}
