        en: Metaprogramming
        kind: choice
        values:
          - {id: textual_macros, ru: Текстовые макросы, en: textual macros}
          - {id: syntactic_macros, ru: Синтаксические макросы, en: syntactic macros}
          - {id: procedural_macros, ru: Процедурные макросы, en: procedural macros}
          - {id: reflection, ru: Рефлексия, en: reflection}
          - {id: compile_time_execution, ru: Вычисление при компиляции, en: compile-time execution}
          - {id: runtime_code, ru: Построение и выполнение кода, en: runtime code generation and execution}
      - id: syntax.macro_hygiene
        slug: syntax-macro-hygiene
        ru: Гигиена макросов
        en: Macro hygiene
        kind: choice
        note: "Ось описывает защиту связываний от непреднамеренного захвата имён при раскрытии, независимо от textual/syntactic/procedural формы трансформера. R7RS syntax-rules сохраняет лексические связывания; негигиеничный механизм требует ручного предотвращения capture. Намеренное нарушение гигиены нужно описывать для конкретного API, не выводить из слова macro."
        values:
          - {id: hygienic, ru: Автоматическая защита от захвата имён, en: hygienic binding preservation}
          - {id: unhygienic, ru: Нет автоматической защиты от захвата, en: no automatic capture protection}
        sources:
          - {url: "https://standards.scheme.org/corrected-r7rs/r7rs-Z-H-6.html", title: "Scheme R7RS-small §4.3 — hygienic macros"}
      - id: syntax.program_representation
        slug: syntax-program-representation
        ru: Нотация исходной программы
        en: Source program notation
        kind: choice
        note: "Текст или структурный граф являются исходной программой, а не иллюстрацией, AST компилятора или визуализацией отладчика. Нотация независима от dataflow semantics: не каждый графический язык имеет правило готовности G. G — язык, LabVIEW — среда; для Prograph/Marten подтверждена графическая нотация, но не все правила исполнения."
        values:
          - {id: textual, ru: Текстовая нотация, en: textual notation}
          - {id: graphical_graph, ru: Граф из узлов и связей, en: graphical nodes and links}
        sources:
          - {url: "https://www.ni.com/en/shop/labview/benefits-of-programming-graphically-in-ni-labview.html", title: "NI — G graphical programming in LabVIEW"}
          - {url: "https://www.andescotia.com/products/marten/", title: "Marten 1.6 — Prograph cases, operations and links (notation only)"}

