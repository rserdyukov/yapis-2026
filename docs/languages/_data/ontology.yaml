          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/memory", title: "Dynamic memory management"}
        kind: choice
        values:
          - {id: gc, ru: Трассирующая сборка мусора, en: tracing garbage collection}
          - {id: refcount, ru: Подсчёт ссылок, en: reference counting}
          - {id: ownership, ru: Владение и время жизни, en: ownership and lifetimes}
          - {id: manual, ru: Ручное, en: manual}
      - id: memory.transfer
        slug: memory-transfer
        ru: Передача и разделение владения
        en: Ownership transfer and sharing
        en_aliases: [move semantics, copy semantics, borrowing]
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/move_constructor", title: "Move constructors"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/copy_constructor", title: "Copy constructors"}
        kind: choice
        values:
          - {id: copy, ru: Копирование значения, en: value copy}
          - {id: move, ru: Перемещение владения, en: ownership move}
          - {id: shared_reference, ru: Разделяемая ссылка на объект, en: shared object reference}
          - {id: shared_borrow, ru: Разделяемое заимствование, en: shared borrow}
          - {id: exclusive_borrow, ru: Исключительное заимствование, en: exclusive borrow}
      - id: memory.reference_permissions
        slug: memory-reference-permissions
        ru: Права ссылок и ограничения алиасов
        en: Reference permissions and alias restrictions
        en_aliases: [reference capabilities, aliasing control]
        references:
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/restrict", title: "restrict type qualifier"}
        kind: choice
        note: "Права относятся к ссылке и совместимым алиасам объекта, а не к перепривязке имени или способу освобождения памяти. Pony val гарантирует неизменяемость объекта, box — только read-only view, ref разрешает изменяемые алиасы, iso изолирует доступ. Изоляция не означает обязательное использование ровно один раз: линейность, аффинность и consume требуют отдельного утверждения; не помечать весь Pony как линейный."
        values:
          - {id: isolated, ru: Изолированный доступ, en: isolated access}
          - {id: mutable_aliases, ru: Изменяемый доступ с алиасами, en: mutable aliased access}
          - {id: immutable_shared, ru: Разделяемый неизменяемый объект, en: shared immutable object}
          - {id: read_only_view, ru: Представление только для чтения, en: read-only view}
          - {id: identity_only, ru: Только идентичность без чтения состояния, en: identity-only access}
        sources:
          - {url: "https://tutorial.ponylang.io/reference-capabilities/reference-capabilities.html", title: "Pony Tutorial — Reference Capabilities: iso, ref, val, box, tag"}

      - id: memory.storage_duration
        slug: memory-storage-duration
        ru: Длительность хранения и время жизни объекта
        en: Storage duration
        en_aliases: [object lifetime, automatic storage, static storage, dynamic storage]
        kind: choice
        note: "Когда выделяется и освобождается память объекта и в какие моменты объект жив. Время жизни относится к объекту, область видимости — к имени: объект с динамической длительностью переживает область имени указателя, а статический локальный объект невидим вне функции. Способ освобождения динамической памяти (сборка мусора, ручное) — memory.management."
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/storage_duration", title: "Storage class specifiers"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/lifetime", title: "Lifetime"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/storage_duration", title: "Storage-class specifiers"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/lifetime", title: "Lifetime"}
        values:
          - {id: automatic, ru: Автоматическая, до выхода из блока, en: automatic}
          - {id: static, ru: Статическая, на всё выполнение программы, en: static}
          - {id: thread, ru: Поточная, на время потока, en: thread}
          - {id: dynamic, ru: Динамическая, до явного или автоматического освобождения, en: dynamic}
      - id: memory.value_categories
        slug: memory-value-categories
        ru: Категории значений выражений
        en: Value categories
        en_aliases: [lvalue, rvalue, glvalue, prvalue, xvalue]
        kind: choice
        note: "Классификация выражений по тому, обозначают ли они объект с идентичностью (место хранения) или только значение, и можно ли забрать их ресурсы. Категория — свойство выражения, а не типа и не объекта: имя переменной типа `T&&` само по себе lvalue. Используется для правил присваивания, взятия адреса, связывания ссылок и выбора перемещения (memory.transfer)."
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/value_category", title: "Value categories"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/value_category", title: "Value categories"}
        values:
          - {id: lvalue_rvalue, ru: Два вида — lvalue и rvalue, en: lvalue/rvalue}
          - {id: identity_movability, ru: По идентичности и возможности перемещения, en: identity and movability (glvalue/prvalue/xvalue)}
          - {id: places_values, ru: Выражения-места и выражения-значения, en: place and value expressions}
      - id: memory.concurrency_model
        slug: memory-concurrency-model
        ru: Модель памяти для параллельного доступа
        en: Memory model
        en_aliases: [data race, happens-before, memory ordering, atomics]
        kind: choice
        note: "Какие значения может прочитать поток при одновременном доступе к памяти и какие гарантии упорядочивания дают атомарные операции и синхронизация. Ось независима от механизма запуска потоков (resources.concurrency): модель определяет смысл общих данных, а не способ создания потока. Гонка данных в C, C++ и unsafe Rust — неопределённое поведение, в Java — определённое, но слабо упорядоченное."
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/memory_model", title: "Memory model"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/multithread", title: "Multi-threaded executions and data races"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/atomic/memory_order", title: "std::memory_order"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/memory_model", title: "Memory model"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/atomic/memory_order", title: "memory_order"}
        values:
          - {id: data_race_undefined, ru: Гонка данных — неопределённое поведение, en: data races are undefined behavior}
          - {id: data_race_defined, ru: Гонка данных имеет ограниченную определённую семантику, en: data races have bounded defined semantics}
          - {id: races_prevented, ru: Гонки данных исключены статически, en: data races statically prevented}
          - {id: explicit_ordering, ru: Явно выбираемое упорядочивание атомарных операций, en: explicit atomic memory ordering}

