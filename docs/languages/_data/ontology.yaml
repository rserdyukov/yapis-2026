        en: Polymorphic contracts
        en_aliases: [interfaces, traits, type classes, protocols]
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/abstract_class", title: "Abstract class"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/constraints", title: "Constraints and concepts"}
        kind: choice
        values:
          - {id: interfaces, ru: Интерфейсы, en: interfaces}
          - {id: traits, ru: Трейты, en: traits}
          - {id: type_classes, ru: Классы типов, en: type classes}
          - {id: protocols, ru: Структурные протоколы, en: structural protocols}
      - id: abstraction.dispatch
