# Независимая от практикума онтология; учебные соответствия — lab-mapping.yaml.
# Примеры необязательны. Пробелы покрытия — информация, а не ошибка каталога.
# Запись карточки: value, note, sources; layer по умолчанию language,
# также standard_library | implementation | tooling; implementation — строка,
# profile — ключ верхнеуровневого profiles карточки, applies_to — текст.
# since/until ссылаются на versions карточки: since включительно, until исключительно.
# Значения choice перечисляют возможности, а не обязательные взаимоисключающие классы.
# legacy_slugs задают перенаправления и допустимые старые маркеры примеров.
schema_version: 2
coverage_policy: informational

categories:
  - id: bindings
    ru: Имена и связывание
    en: Names and binding
    concepts:
      - id: bindings.introduction
        slug: bindings-introduction
        legacy_slugs: [variants-1]
        ru: Введение связывания
        en: Binding introduction
        kind: choice
        note: "Наличие объявления независимо от аннотации и вывода типа; var в Java — явное объявление."
        values:
          - {id: explicit, ru: Явное объявление, en: explicit declaration}
          - {id: assignment, ru: Связывание присваиванием, en: assignment binding}
          - {id: pattern, ru: Связывание образцом, en: pattern binding}
          - {id: logic_variable, ru: Логическая переменная в терме, en: logic variable in a term}
      - id: bindings.mutation
        slug: bindings-mutation
        ru: Изменяемость связывания
        en: Binding mutability
        kind: choice
        note: "Изменяемость объекта отделена от возможности перепривязать имя."
        values:
          - {id: rebindable, ru: Перепривязываемое, en: rebindable}
          - {id: immutable, ru: Неизменяемое, en: immutable}
          - {id: single_assignment, ru: Однократное связывание логической переменной, en: single-assignment logic binding}
      - id: bindings.assignment
        slug: bindings-assignment
        legacy_slugs: [variants-3]
        ru: Формы присваивания и связывания
        en: Assignment and binding forms
        kind: choice
        values:
          - {id: single, ru: Одиночное присваивание, en: single-target assignment}
          - {id: multiple, ru: Распаковка при присваивании, en: destructuring assignment}
          - {id: unification, ru: Унификация термов, en: term unification}
          - {id: immutable_definition, ru: Неизменяемое определение, en: immutable definition}

  - id: scope
    ru: Области видимости
    en: Scope
    concepts:
      - id: scope.resolution
        slug: scope-resolution
        ru: Правило разрешения имён
        en: Name resolution
        kind: choice
        values:
          - {id: lexical, ru: Лексическое, en: lexical}
          - {id: dynamic, ru: Динамическое, en: dynamic, note: "Например, special-переменные Common Lisp; не синоним динамической типизации."}
      - id: scope.constructs
        slug: scope-constructs
        legacy_slugs: [variants-4]
        ru: Конструкции областей видимости
        en: Scoping constructs
        kind: choice
        values:
          - {id: subprogram, ru: Подпрограмма, en: subprogram}
          - {id: block, ru: Блок, en: block}
          - {id: module, ru: Модуль, en: module}
          - {id: class, ru: Класс, en: class}
          - {id: comprehension, ru: Генераторная конструкция, en: comprehension}
          - {id: binding_form, ru: Форма связывания let/where, en: let/where binding form}
          - {id: clause, ru: Логическая клауза, en: logic clause}
      - id: scope.globals
        slug: scope-globals
        legacy_slugs: [req-8-2]
        ru: Связывания верхнего уровня
        en: Top-level bindings
        kind: choice
        values:
          - {id: globals, ru: Глобальные переменные, en: global variables}
          - {id: module_bindings, ru: Имена модуля, en: module bindings}
          - {id: static_members, ru: Статические члены типов, en: static type members}
      - id: scope.shadowing
        slug: scope-shadowing
        legacy_slugs: [syntax-shadowing]
        ru: Сокрытие имён
        en: Name shadowing
        kind: choice
        note: "Повторное присваивание тому же имени в Python — перепривязка, а не shadowing."
        values:
          - {id: allowed, ru: Во вложенной области, en: nested-scope shadowing}
          - {id: forbidden_in_block, ru: Запрет сокрытия локальных в охватывающем блоке, en: enclosing-local shadowing forbidden}
          - {id: allowed_same_scope, ru: Новое связывание в той же области, en: new binding in the same scope}

  - id: typing
    ru: Типизация
    en: Typing
    concepts:
      - id: typing.checking
        slug: typing-checking
        ru: Проверка типов
        en: Type checking
        kind: choice
        aliases: [статическая типизация, динамическая типизация]
        values:
          - {id: static, ru: Статическая, en: static}
          - {id: dynamic, ru: Динамическая, en: dynamic}
          - {id: gradual, ru: Постепенная, en: gradual, note: "Статически типизированные и динамические части; для внешнего анализатора указывается layer tooling."}
      - id: typing.annotations
        slug: typing-annotations
        ru: Аннотации типов
        en: Type annotations
        kind: choice
        values:
          - {id: required, ru: Обязательны, en: required}
          - {id: optional, ru: Необязательны, en: optional}
          - {id: absent, ru: Отсутствуют, en: absent}
      - id: typing.inference
        slug: typing-inference
        ru: Вывод статических типов
        en: Static type inference
        kind: bool
      - id: typing.conversions
        slug: typing-conversions
        legacy_slugs: [variants-2, typing-strength]
        ru: Преобразования типов
        en: Type conversions
        kind: choice
        note: "Ось заменяет неоднозначное деление strong/weak; допустимость и потери описываются в контексте."
        values:
          - {id: explicit, ru: Явные, en: explicit}
          - {id: implicit, ru: Неявные, en: implicit coercions}
      - id: typing.compatibility
        slug: typing-compatibility
        ru: Совместимость типов
        en: Type compatibility
        kind: choice
        values:
          - {id: nominal, ru: Номинальная, en: nominal}
          - {id: structural, ru: Структурная, en: structural}
          - {id: duck, ru: По доступным операциям во время выполнения, en: runtime duck typing}
      - id: typing.sum_types
        slug: typing-sum-types
        ru: Типы-суммы
        en: Sum types
        kind: choice
        values:
          - {id: tagged, ru: Размеченные варианты, en: tagged variants}
          - {id: union, ru: Объединения типов, en: type unions}
          - {id: closed_hierarchy, ru: Закрытая иерархия, en: closed hierarchy}
      - id: typing.product_types
        slug: typing-product-types
        ru: Типы-произведения
        en: Product types
        kind: choice
        values:
          - {id: tuple, ru: Кортежи, en: tuples}
          - {id: record, ru: Записи и структуры, en: records and structs}
      - id: typing.nullability
        slug: typing-nullability
        ru: Представление отсутствия значения
        en: Absence of a value
        kind: choice
        values:
          - {id: nullable_everywhere, ru: Nullable-ссылки по умолчанию, en: nullable references by default}
          - {id: optional_type, ru: Тип Option/Optional, en: option type}
          - {id: nullable_types, ru: Явно nullable-типы, en: explicitly nullable types}
          - {id: sentinel, ru: Специальное значение, en: sentinel value, note: "Например, None; его допустимость зависит от операции."}
      - id: typing.value_dependency
        slug: typing-value-dependency
        ru: Зависимость типа от значения
        en: Value-dependent types
        kind: choice
        note: "Тип может зависеть от значения параметра: Vect n a связывает длину с n, в отличие от параметризации только типом a. Зависимые пары связывают тип второго компонента со значением первого. Проверка типов сама по себе не гарантирует тотальность."
        values:
          - {id: indexed_families, ru: Семейства типов с индексами-значениями, en: value-indexed type families}
          - {id: dependent_functions, ru: Зависимые типы функций, en: dependent function types}
          - {id: dependent_pairs, ru: Зависимые пары, en: dependent pairs}
        sources:
          - {url: "https://idris2.readthedocs.io/en/latest/tutorial/typesfuns.html", title: "Idris 2 — Types and Functions: Vect, Fin, dependent pairs"}
      - id: typing.abstract_type_identity
        slug: typing-abstract-type-identity
        ru: Идентичность абстрактных типов модулей
        en: Abstract module type identity
        kind: choice
        note: "Прозрачное сопоставление сигнатуре сохраняет известные равенства типов; opaque sealing скрывает представление абстрактных компонентов. В SML '97 применение functor с opaque result signature создаёт свежие абстрактные типы. Это не свойство каждого type alias и не синоним nominal/structural compatibility."
        values:
          - {id: transparent, ru: Сохранение равенств типов представления, en: transparent type equality}
          - {id: opaque_fresh, ru: Свежая идентичность скрытого абстрактного типа, en: fresh opaque abstract identity}
        sources:
          - {url: "https://www.smlnj.org/doc/Conversion/modules.html", title: "SML '97 Modules — signatures and §1.3.9 opaque result signatures"}

  - id: control
    ru: Управление потоком
    en: Control flow
    concepts:
      - id: control.selection
        slug: control-selection
        legacy_slugs: [variants-6]
        ru: Условный выбор
        en: Conditional selection
        kind: choice
        values:
          - {id: statement, ru: Условный оператор, en: conditional statement}
          - {id: expression, ru: Условное выражение, en: conditional expression}
          - {id: guards, ru: Охранные условия, en: guards}
      - id: control.switch
        slug: control-switch
        ru: Выбор по значению switch/case
        en: Switch/case value selection
        kind: bool
        note: "Учитывается отдельная конструкция switch/case, не любая цепочка условий или match."
      - id: control.pattern_matching
        slug: control-pattern-matching
        ru: Сопоставление с образцом
        en: Pattern matching
        kind: bool
      - id: control.until
        slug: control-until
        legacy_slugs: [req-7-2-until]
        ru: Цикл до истинности условия
        en: Until loop
        kind: choice
        note: "Отрицательная полярность условия не определяет момент проверки. Имитирующий код не означает наличие конструкции."
        values:
          - {id: pre_test, ru: Проверка перед телом, en: pre-test until}
          - {id: post_test, ru: Проверка после тела, en: post-test repeat-until}
          - {id: absent, ru: Отдельная конструкция отсутствует, en: no dedicated until construct}
      - id: control.do_while
        slug: control-do-while
        legacy_slugs: [req-7-2-do-while]
        ru: Цикл do-while с постусловием
        en: Post-test do-while loop
        kind: bool
      - id: control.iteration
        slug: control-iteration
        legacy_slugs: [req-7-3]
        ru: Формы итерации
        en: Iteration forms
        kind: choice
        values:
          - {id: c_style, ru: Инициализация / условие / шаг, en: C-style loop}
          - {id: foreach, ru: По последовательности или итератору, en: foreach}
          - {id: comprehension, ru: Генераторная конструкция, en: comprehension}
          - {id: higher_order, ru: Функции обхода, en: higher-order traversal}
      - id: control.logic_search
        slug: control-logic-search
        ru: Логический поиск решений
        en: Logic search
        kind: choice
        values:
          - {id: backtracking, ru: Поиск с возвратом, en: backtracking}
          - {id: tabling, ru: Табулирование подцелей, en: tabling}
          - {id: constraints, ru: Распространение ограничений, en: constraint propagation}
      - id: control.continuation_extent
        slug: control-continuation-extent
        ru: Граница захвата продолжения
        en: Continuation capture boundary
        kind: choice
        note: "Продолжение представляет оставшийся контекст вычисления, а не только окружение замыкания. Undelimited захватывает полный текущий контекст; delimited — часть до заданной границы (prompt). Время жизни, escape-only и число допустимых возобновлений указываются отдельно в контексте: R7RS call/cc допускает сохранение и повторные вызовы, но это не определение границы захвата."
        values:
          - {id: undelimited, ru: Полное продолжение, en: undelimited continuation}
          - {id: delimited, ru: Продолжение до ограничителя, en: delimited continuation}
        sources:
          - {url: "https://standards.scheme.org/corrected-r7rs/r7rs-Z-H-8.html", title: "Scheme R7RS-small §6.10 — call-with-current-continuation"}
          - {url: "https://docs.racket-lang.org/reference/cont.html", title: "Racket Reference §10.4 — prompts and delimited continuations"}

  - id: subprograms
    ru: Подпрограммы и абстракция
    en: Subprograms and abstraction
    concepts:
      - id: subprograms.overloading
        slug: subprograms-overloading
        legacy_slugs: [variants-7]
        ru: Перегрузка по сигнатуре
        en: Signature overloading
        kind: bool
      - id: subprograms.parameter_passing
        slug: subprograms-parameter-passing
        legacy_slugs: [variants-8]
        ru: Связывание параметров
        en: Parameter passing
        kind: choice
        note: "Передача значения отделена от переноса владения; ссылка сама может передаваться по значению."
        values:
          - {id: by_value, ru: По значению, en: by value}
          - {id: by_reference, ru: По ссылке на переменную, en: by reference}
          - {id: by_result, ru: Копирование результата при возврате, en: copy out}
          - {id: by_value_result, ru: Копирование входа и результата, en: copy in/copy out}
          - {id: by_sharing, ru: Разделение объекта, en: call by sharing}
          - {id: by_name, ru: По имени, en: by name}
          - {id: by_need, ru: По необходимости с мемоизацией, en: by need}
          - {id: unification, ru: Унификация аргументов с термами головы, en: head-argument unification}
      - id: subprograms.placement
        slug: subprograms-placement
        legacy_slugs: [variants-9]
        ru: Место определения подпрограмм
        en: Subprogram definition placement
        kind: choice
        values:
          - {id: declaration_region, ru: Выделенная область объявлений, en: declaration region}
          - {id: module, ru: Верхний уровень модуля, en: module level}
          - {id: type_member, ru: Член типа, en: type member}
          - {id: local, ru: Локальное определение, en: local definition}
      - id: subprograms.nesting
        slug: subprograms-nesting
        ru: Вложенные именованные подпрограммы
        en: Nested named subprograms
        kind: bool
      - id: subprograms.closures
        slug: subprograms-closures
        ru: Захват окружения
        en: Closure capture
        kind: bool
      - id: subprograms.lambda
        slug: subprograms-lambda
        ru: Анонимные функции
        en: Anonymous functions
        kind: bool
      - id: subprograms.generics
        slug: subprograms-generics
        ru: Параметрический полиморфизм
        en: Parametric polymorphism
        kind: bool
      - id: subprograms.generic_mechanism
        slug: subprograms-generic-mechanism
        ru: Реализация параметрического полиморфизма
        en: Generic implementation mechanism
        kind: choice
        values:
          - {id: erasure, ru: Стирание типов, en: type erasure}
          - {id: monomorphization, ru: Мономорфизация, en: monomorphization}
          - {id: reification, ru: Параметры типов во время выполнения, en: reified type parameters}
          - {id: dictionary_passing, ru: Передача словарей операций, en: dictionary passing}
      - id: subprograms.default_args
        slug: subprograms-default-args
        ru: Аргументы по умолчанию
        en: Default arguments
        kind: bool
      - id: subprograms.named_args
        slug: subprograms-named-args
        ru: Именованные аргументы
        en: Named arguments
        kind: bool

  - id: abstraction
    ru: Полиморфизм и организация
    en: Polymorphism and organization
    concepts:
      - id: abstraction.contracts
        slug: abstraction-contracts
        ru: Контракты полиморфизма
        en: Polymorphic contracts
        kind: choice
        values:
          - {id: interfaces, ru: Интерфейсы, en: interfaces}
          - {id: traits, ru: Трейты, en: traits}
          - {id: type_classes, ru: Классы типов, en: type classes}
          - {id: protocols, ru: Структурные протоколы, en: structural protocols}
      - id: abstraction.dispatch
        slug: abstraction-dispatch
        ru: Диспетчеризация вызовов
        en: Call dispatch
        kind: choice
        values:
          - {id: static, ru: Статическая, en: static dispatch}
          - {id: single, ru: По одному динамическому типу, en: single dispatch}
          - {id: multiple, ru: По нескольким динамическим типам, en: multiple dispatch}
      - id: abstraction.inheritance
        slug: abstraction-inheritance
        ru: Наследование реализации
        en: Implementation inheritance
        kind: choice
        values:
          - {id: single, ru: Одиночное, en: single}
          - {id: multiple, ru: Множественное, en: multiple}
          - {id: absent, ru: Отсутствует, en: absent}
      - id: abstraction.modules
        slug: abstraction-modules
        ru: Модульность
        en: Modules
        kind: choice
        values:
          - {id: textual_inclusion, ru: Текстовое включение, en: textual inclusion}
          - {id: namespaces, ru: Пространства имён и пакеты, en: namespaces and packages}
          - {id: explicit_exports, ru: Явная граница экспорта, en: explicit export boundary}
          - {id: runtime_modules, ru: Модули как объекты времени выполнения, en: runtime module objects}
          - id: module_functors
            ru: Параметризация модулей модулями
            en: module functors
            note: "SML functor принимает структуру по сигнатуре, включая типовые компоненты, и строит структуру-результат. Это не generic function; скрытие и идентичность типов описывает typing.abstract_type_identity."
            sources:
              - {url: "https://www.smlnj.org/doc/Conversion/modules.html", title: "SML '97 Modules — structures, signatures and functors"}

  - id: evaluation
    ru: Вычисление и эффекты
    en: Evaluation and effects
    concepts:
      - id: evaluation.strategy
        slug: evaluation-strategy
        ru: Стратегия вычисления
        en: Evaluation strategy
        kind: choice
        values:
          - {id: strict, ru: Строгая, en: strict}
          - {id: non_strict, ru: Нестрогая, en: non-strict}
        note: "Отложенный генератор сам по себе не делает вычисление обычных аргументов нестрогим."
      - id: evaluation.effects
        slug: evaluation-effects
        ru: Контроль эффектов
        en: Effect control
        kind: choice
        values:
          - {id: unrestricted, ru: Без общего статического разделения эффектов, en: no general static effect separation}
          - {id: type_tracked, ru: Эффекты отражены в типах, en: type-tracked effects}
          - {id: effect_handlers, ru: Обработчики алгебраических эффектов, en: algebraic effect handlers}
      - id: evaluation.tail_calls
        slug: evaluation-tail-calls
        ru: Гарантированное устранение хвостовых вызовов
        en: Guaranteed tail-call elimination
        kind: bool
      - id: evaluation.rank_lifting
        slug: evaluation-rank-lifting
        ru: Поднятие операций по рангу массива
        en: Array rank lifting
        kind: choice
        note: "Shape — размеры осей, rank — их число; cell — подмассив выбранного ранга, frame — оставшиеся оси. Ось описывает автоматическое применение операции к элементам или cells и согласование аргументов, а не просто наличие N-мерных массивов. Правила agreement J и Dyalog фиксируются отдельно; явный map не доказывает rank lifting."
        values:
          - {id: scalar_extension, ru: Распространение скаляра на элементы массива, en: scalar extension}
          - {id: cell_rank, ru: Применение к ячейкам выбранного ранга, en: rank-selected cell application}
        sources:
          - {url: "https://www.jsoftware.com/help/dictionary/dicta.htm", title: "J Dictionary — Nouns: shape, rank and cells"}
          - {url: "https://www.jsoftware.com/help/dictionary/dictb.htm", title: "J Dictionary — Verbs: rank and agreement"}
          - {url: "https://help.dyalog.com/19.0/Content/Language/Primitive%20Operators/Rank.htm", title: "Dyalog APL 19.0 — Rank operator"}
      - id: evaluation.result_protocol
        slug: evaluation-result-protocol
        ru: Протокол выдачи и возобновления результатов
        en: Result and resumption protocol
        kind: choice
        note: "Кто запрашивает следующий результат: caller при обычном возврате, потребитель генератора/корутины или охватывающее выражение после неудачи? Python yield и Lua resume/yield дают явное возобновление; Icon автоматически ищет альтернативу внутреннего генератора при неудаче внешнего выражения. Несколько значений одного return не являются потоком альтернатив. Это не strictness и не гарантия конкурентного исполнения."
        values:
          - {id: ordinary_return, ru: Обычный возврат результата вызова, en: ordinary call return}
          - {id: explicit_resume, ru: Явное возобновление генератора или корутины, en: explicit generator or coroutine resumption}
          - {id: goal_directed, ru: Возобновление альтернатив по неудаче выражения, en: goal-directed resumption on failure}
        sources:
          - {url: "https://www2.cs.arizona.edu/icon/docs/ipd266.htm", title: "Griswold — Icon overview §§2–3: generators and goal-directed evaluation"}
          - {url: "https://docs.python.org/3/library/stdtypes.html#iterator-types", title: "Python 3 — Iterator and Generator Types"}
          - {url: "https://www.lua.org/manual/5.4/manual.html#2.6", title: "Lua 5.4 Reference Manual §2.6 — Coroutines"}
      - id: evaluation.data_availability
        slug: evaluation-data-availability
        ru: Ожидание доступности данных
        en: Data availability suspension
        kind: choice
        note: "В Oz 3 поток приостанавливается, когда операции не хватает информации о логической переменной; в G готовность узла определяется наличием всех требуемых входов. Это разные условия запуска, независимые от strictness, порядка операндов и mailbox/rendezvous. Наличие унификации не означает автоматического ожидания."
        values:
          - {id: needed_information, ru: Ожидание необходимой операции информации, en: suspension on needed information}
          - {id: all_inputs, ru: Готовность по всем входам узла, en: all-input node readiness}
        sources:
          - {url: "https://mozart.github.io/mozart-v1/doc-1.4.0/tutorial/node1.html", title: "Mozart 1.4.0 tutorial — Oz 3 dataflow threads"}
          - {url: "https://www.ni.com/en/shop/labview/benefits-of-programming-graphically-in-ni-labview.html", title: "NI — G dataflow and node readiness in LabVIEW"}

