      - id: subprograms.overload_resolution
        slug: subprograms-overload-resolution
        ru: Разрешение перегрузки
        en: Overload resolution
        en_aliases: [best viable function, argument-dependent lookup]
        kind: choice
        note: "Как из набора одноимённых кандидатов выбирается вызываемая функция. Наличие перегрузки (subprograms.overloading) не определяет правила выбора: ранжирование преобразований, поиск кандидатов и неоднозначность описываются здесь. Выбор во время выполнения по динамическим типам — abstraction.dispatch."
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/overload_resolution", title: "Overload resolution"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/adl", title: "Argument-dependent lookup"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/generic", title: "Generic selection"}
        values:
          - {id: conversion_ranking, ru: Ранжирование неявных преобразований аргументов, en: implicit conversion ranking}
          - {id: exact_signature, ru: Точное совпадение типов без ранжирования, en: exact signature match}
          - {id: argument_dependent_lookup, ru: Поиск кандидатов по типам аргументов, en: argument-dependent lookup}
          - {id: arity, ru: По числу аргументов, en: by arity}

  - id: abstraction
    ru: Полиморфизм и организация
    en: Polymorphism and organization
    concepts:
      - id: abstraction.contracts
