  - id: evaluation
    ru: Вычисление и эффекты
    en: Evaluation and effects
    concepts:
      - id: evaluation.strategy
        slug: evaluation-strategy
        ru: Стратегия вычисления
        en: Evaluation strategy
        en_aliases: [eager evaluation, lazy evaluation]
        kind: choice
        values:
          - {id: strict, ru: Строгая, en: strict}
          - {id: non_strict, ru: Нестрогая, en: non-strict}
        note: "Отложенный генератор сам по себе не делает вычисление обычных аргументов нестрогим."
      - id: evaluation.effects
        slug: evaluation-effects
        ru: Контроль эффектов
        en: Effect control
        en_aliases: [effect system, purity]
        kind: choice
        values:
          - {id: unrestricted, ru: Без общего статического разделения эффектов, en: no general static effect separation}
          - {id: type_tracked, ru: Эффекты отражены в типах, en: type-tracked effects}
          - {id: effect_handlers, ru: Обработчики алгебраических эффектов, en: algebraic effect handlers}
      - id: evaluation.tail_calls
        slug: evaluation-tail-calls
        ru: Гарантированное устранение хвостовых вызовов
        en: Tail-call elimination
        en_aliases: [proper tail calls, tail-call optimization]
        kind: bool
      - id: evaluation.rank_lifting
        slug: evaluation-rank-lifting
        ru: Поднятие операций по рангу массива
        en: Array rank lifting
        en_aliases: [rank polymorphism, scalar extension]
        kind: choice
        note: "Shape — размеры осей, rank — их число; cell — подмассив выбранного ранга, frame — оставшиеся оси. Ось описывает автоматическое применение операции к элементам или cells и согласование аргументов, а не просто наличие N-мерных массивов. Правила agreement J и Dyalog фиксируются отдельно; явный map не доказывает rank lifting."
        values:
          - {id: scalar_extension, ru: Распространение скаляра на элементы массива, en: scalar extension}
          - {id: cell_rank, ru: Применение к ячейкам выбранного ранга, en: rank-selected cell application}
        sources:
          - {url: "https://www.jsoftware.com/help/dictionary/dicta.htm", title: "J Dictionary — Nouns: shape, rank and cells"}
          - {url: "https://www.jsoftware.com/help/dictionary/dictb.htm", title: "J Dictionary — Verbs: rank and agreement"}
          - {url: "https://help.dyalog.com/19.0/Content/Language/Primitive%20Operators/Rank.htm", title: "Dyalog APL 19.0 — Rank operator"}
      - id: evaluation.result_protocol
        slug: evaluation-result-protocol
        ru: Протокол выдачи и возобновления результатов
        en: Result and resumption protocol
        en_aliases: [generators, coroutines, goal-directed evaluation]
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/coroutines", title: "Coroutines"}
        kind: choice
        note: "Кто запрашивает следующий результат: caller при обычном возврате, потребитель генератора/корутины или охватывающее выражение после неудачи? Python yield и Lua resume/yield дают явное возобновление; Icon автоматически ищет альтернативу внутреннего генератора при неудаче внешнего выражения. Несколько значений одного return не являются потоком альтернатив. Это не strictness и не гарантия конкурентного исполнения."
        values:
          - {id: ordinary_return, ru: Обычный возврат результата вызова, en: ordinary call return}
          - {id: explicit_resume, ru: Явное возобновление генератора или корутины, en: explicit generator or coroutine resumption}
          - {id: goal_directed, ru: Возобновление альтернатив по неудаче выражения, en: goal-directed resumption on failure}
        sources:
          - {url: "https://www2.cs.arizona.edu/icon/docs/ipd266.htm", title: "Griswold — Icon overview §§2–3: generators and goal-directed evaluation"}
          - {url: "https://docs.python.org/3/library/stdtypes.html#iterator-types", title: "Python 3 — Iterator and Generator Types"}
          - {url: "https://www.lua.org/manual/5.4/manual.html#2.6", title: "Lua 5.4 Reference Manual §2.6 — Coroutines"}
      - id: evaluation.data_availability
        slug: evaluation-data-availability
        ru: Ожидание доступности данных
        en: Data availability suspension
        en_aliases: [dataflow variables, dataflow execution]
        kind: choice
        note: "В Oz 3 поток приостанавливается, когда операции не хватает информации о логической переменной; в G готовность узла определяется наличием всех требуемых входов. Это разные условия запуска, независимые от strictness, порядка операндов и mailbox/rendezvous. Наличие унификации не означает автоматического ожидания."
        values:
          - {id: needed_information, ru: Ожидание необходимой операции информации, en: suspension on needed information}
          - {id: all_inputs, ru: Готовность по всем входам узла, en: all-input node readiness}
        sources:
          - {url: "https://mozart.github.io/mozart-v1/doc-1.4.0/tutorial/node1.html", title: "Mozart 1.4.0 tutorial — Oz 3 dataflow threads"}
          - {url: "https://www.ni.com/en/shop/labview/benefits-of-programming-graphically-in-ni-labview.html", title: "NI — G dataflow and node readiness in LabVIEW"}

      - id: evaluation.order
        slug: evaluation-order
        ru: Порядок вычисления подвыражений
        en: Order of evaluation
        en_aliases: [sequencing, sequence points, sequenced-before]
        kind: choice
        note: "В каком порядке вычисляются операнды одного выражения и аргументы вызова. Ось независима от приоритета и ассоциативности операций: `f() + g() * h()` группируется однозначно, а порядок вызовов может быть не задан. Не путать со strictness (evaluation.strategy): строгая стратегия требует вычислить аргументы до вызова, но не задаёт их взаимный порядок. Непоследовательные модификации одного объекта в C и C++ дают неопределённое поведение."
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/eval_order", title: "Order of evaluation"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/eval_order", title: "Order of evaluation"}
        values:
          - {id: left_to_right, ru: Слева направо, en: left-to-right}
          - {id: unspecified, ru: Не задан стандартом, en: unspecified}
          - {id: partially_sequenced, ru: Задан для отдельных операций, en: sequenced for specific operators}
      - id: evaluation.undefined_behavior
        slug: evaluation-undefined-behavior
        ru: Неопределённое поведение
        en: Undefined behavior
        en_aliases: [UB, unspecified behavior, implementation-defined behavior]
        kind: choice
        note: "Как спецификация описывает программы, нарушающие её правила или зависящие от выбора реализации. Implementation-defined — реализация выбирает и документирует; unspecified — выбор из допустимых вариантов без документирования; undefined — стандарт не накладывает требований на всё выполнение, а компилятор вправе оптимизировать, считая UB невозможным. Это не синоним ошибки времени выполнения: гарантированное исключение или паника — определённое поведение (errors.model)."
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/ub", title: "Undefined behavior"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/as_if", title: "The as-if rule"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/behavior", title: "Undefined behavior"}
        values:
          - {id: undefined, ru: Неопределённое поведение, en: undefined behavior}
          - {id: unspecified, ru: Неуточнённое поведение, en: unspecified behavior}
          - {id: implementation_defined, ru: Определяемое реализацией, en: implementation-defined behavior}
          - {id: checked, ru: Нарушение правил обнаруживается и даёт определённый результат, en: checked with defined outcome}
      - id: evaluation.compile_time
        slug: evaluation-compile-time
        ru: Вычисления во время компиляции
        en: Constant evaluation
        en_aliases: [compile-time evaluation, constant expressions, constexpr]
        kind: choice
        note: "Какие вычисления язык требует или разрешает выполнить при трансляции и где результат обязателен (размер массива, аргумент шаблона). Ось уже syntax.metaprogramming: там описано порождение кода, здесь — вычисление значений. Оптимизирующее свёртывание констант компилятором без гарантии языка сюда не относится."
        references:
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/constant_expression", title: "Constant expressions"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/constexpr", title: "constexpr specifier"}
          - {source: cppreference, languages: [cpp], url: "https://cppreference.com/cpp/language/consteval", title: "consteval specifier"}
          - {source: cppreference, languages: [c], url: "https://cppreference.com/c/language/constant_expression", title: "Constant expressions"}
        values:
          - {id: constant_expressions, ru: Константные выражения из ограниченного набора операций, en: restricted constant expressions}
          - {id: compile_time_functions, ru: Функции, допускающие вычисление при компиляции, en: compile-time-evaluable functions}
          - {id: mandatory_compile_time, ru: Функции, вычисляемые только при компиляции, en: compile-time-only functions}

  - id: memory
    ru: Память и владение
    en: Memory and ownership
    concepts:
      - id: memory.management
        slug: memory-management
