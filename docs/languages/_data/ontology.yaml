          - {id: manual, ru: Ручное, en: manual}
      - id: memory.transfer
        slug: memory-transfer
        ru: Передача и разделение владения
        en: Ownership transfer and sharing
        kind: choice
        values:
          - {id: copy, ru: Копирование значения, en: value copy}
          - {id: move, ru: Перемещение владения, en: ownership move}
          - {id: shared_reference, ru: Разделяемая ссылка на объект, en: shared object reference}
          - {id: shared_borrow, ru: Разделяемое заимствование, en: shared borrow}
          - {id: exclusive_borrow, ru: Исключительное заимствование, en: exclusive borrow}
      - id: memory.reference_permissions
        slug: memory-reference-permissions
        ru: Права ссылок и ограничения алиасов
        en: Reference permissions and alias restrictions
        kind: choice
        note: "Права относятся к ссылке и совместимым алиасам объекта, а не к перепривязке имени или способу освобождения памяти. Pony val гарантирует неизменяемость объекта, box — только read-only view, ref разрешает изменяемые алиасы, iso изолирует доступ. Изоляция не означает обязательное использование ровно один раз: линейность, аффинность и consume требуют отдельного утверждения; не помечать весь Pony как линейный."
        values:
          - {id: isolated, ru: Изолированный доступ, en: isolated access}
          - {id: mutable_aliases, ru: Изменяемый доступ с алиасами, en: mutable aliased access}
          - {id: immutable_shared, ru: Разделяемый неизменяемый объект, en: shared immutable object}
          - {id: read_only_view, ru: Представление только для чтения, en: read-only view}
          - {id: identity_only, ru: Только идентичность без чтения состояния, en: identity-only access}
        sources:
          - {url: "https://tutorial.ponylang.io/reference-capabilities/reference-capabilities.html", title: "Pony Tutorial — Reference Capabilities: iso, ref, val, box, tag"}

