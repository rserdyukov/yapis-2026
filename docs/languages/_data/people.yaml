# Связи хранятся в одном направлении и строятся в обратную сторону генератором:
#   person.languages  → карточка языка показывает «Люди»
#   person.concepts   → словарь показывает «Люди» у понятия
#   person.lectures   → номер колоды docs/lectures/slides/NN-*.md
#   source.people     → в sources.yaml; у человека строится список источников
