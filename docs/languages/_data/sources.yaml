# Источники онтологии: книги, статьи, конференции, сайты, документация и
# инструменты. Заменяет ручную страницу «Книги и ресурсы».
#
# kind      book | article | conference | site | documentation | tool
# people    id из people.yaml — авторы или ключевые участники (обратная связь
#           «Источники» у человека строится генератором)
# authors   авторы, которых нет в people.yaml (свободный текст)
# languages id карточек каталога; concepts — id понятий онтологии;
# lectures  номера колод docs/lectures/slides/NN-*.md;
# labs      номера лабораторных работ, к которым источник полезен
# topic     подзаголовок группы для documentation/tool
# note      зачем читать — обязательное поле: ссылка без причины не нужна
#
# DOI сверены с Crossref 2026-09-24.
