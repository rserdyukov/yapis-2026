site_name: Языковые процессоры интеллектуальных систем
site_description: Курс ЯПИС — лабораторный практикум, лекции и дополнительные материалы
site_url: https://rserdyukov.github.io/yapis-2026/
repo_url: https://github.com/rserdyukov/yapis-2026
repo_name: rserdyukov/yapis-2026
copyright: Курс «Языковые процессоры интеллектуальных систем»

docs_dir: docs
site_dir: site

# Ломать сборку на битой ссылке. Перекрёстных ссылок в курсе много,
# и молча отдавать студентам 404 хуже, чем упасть в CI.
strict: true

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs/_partials
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rserdyukov/yapis-2026

# Исходники сборки: отдельными страницами не публикуются.
#   _partials/       — фрагменты текста задания (собираются build-docs.py)
#   lectures/slides/ — Marp-колоды; на сайт идёт готовый HTML в lectures/html/
#   lectures/theme/  — CSS темы Marp, нужен только на этапе сборки слайдов
exclude_docs: |
  _partials/
  lectures/slides/
  lectures/theme/
